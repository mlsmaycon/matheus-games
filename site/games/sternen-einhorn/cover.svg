<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0420"/><stop offset=".6" stop-color="#21104a"/><stop offset="1" stop-color="#3a1659"/></linearGradient>
    <radialGradient id="neb1"><stop offset="0" stop-color="#ff5ac8" stop-opacity=".35"/><stop offset="1" stop-color="#ff5ac8" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2"><stop offset="0" stop-color="#508cff" stop-opacity=".35"/><stop offset="1" stop-color="#508cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffdcff" stop-opacity=".55"/><stop offset="1" stop-color="#ffdcff" stop-opacity="0"/></radialGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffcf4d"/><stop offset="1" stop-color="#fff6c2"/></linearGradient>
    <radialGradient id="planet" cx=".35" cy=".3"><stop offset="0" stop-color="#ffc6e8"/><stop offset="1" stop-color="#8c4bff"/></radialGradient>
    <g id="star"><path d="M0-14L4-5 14-4 6 3 9 13 0 7-9 13-6 3-14-4-4-5z"/></g>
  </defs>
  <rect width="640" height="400" fill="url(#sky)"/>
  <circle cx="470" cy="110" r="190" fill="url(#neb1)"/>
  <circle cx="120" cy="320" r="200" fill="url(#neb2)"/>
  <!-- tiny background stars -->
  <g fill="#fff">
    <circle cx="40" cy="40" r="1.6"/><circle cx="96" cy="88" r="1.2"/><circle cx="150" cy="30" r="1.8"/><circle cx="230" cy="70" r="1.1"/>
    <circle cx="300" cy="24" r="1.5"/><circle cx="380" cy="60" r="1.2"/><circle cx="440" cy="20" r="1.7"/><circle cx="520" cy="44" r="1.2"/>
    <circle cx="600" cy="30" r="1.6"/><circle cx="610" cy="140" r="1.2"/><circle cx="560" cy="200" r="1.5"/><circle cx="30" cy="180" r="1.3"/>
    <circle cx="70" cy="250" r="1.6"/><circle cx="200" cy="360" r="1.2"/><circle cx="330" cy="380" r="1.5"/><circle cx="420" cy="350" r="1.2"/>
  </g>
  <!-- rainbow -->
  <g fill="none" stroke-width="14">
    <path d="M60 400a260 260 0 0 1 520 0" stroke="#ff4d6d"/>
    <path d="M74 400a246 246 0 0 1 492 0" stroke="#ff9f43"/>
    <path d="M88 400a232 232 0 0 1 464 0" stroke="#ffd93d"/>
    <path d="M102 400a218 218 0 0 1 436 0" stroke="#6bdb6b"/>
    <path d="M116 400a204 204 0 0 1 408 0" stroke="#4dabff"/>
    <path d="M130 400a190 190 0 0 1 380 0" stroke="#6c63ff"/>
    <path d="M144 400a176 176 0 0 1 352 0" stroke="#c56cf0"/>
  </g>
  <!-- planet -->
  <g transform="translate(555 320) rotate(-20)">
    <ellipse rx="66" ry="15" fill="none" stroke="#ffdcfa" stroke-opacity=".6" stroke-width="5"/>
    <circle r="38" fill="url(#planet)"/>
    <path d="M-66 0a66 15 0 0 0 132 0" fill="none" stroke="#ffdcfa" stroke-opacity=".6" stroke-width="5"/>
  </g>
  <!-- stars to catch -->
  <g fill="#ffd93d">
    <use href="#star" transform="translate(470 120) rotate(15) scale(1.4)"/>
    <use href="#star" transform="translate(545 210) rotate(-10)"/>
    <use href="#star" transform="translate(420 300) scale(1.1)"/>
  </g>
  <!-- coins -->
  <g transform="translate(520 150)"><circle r="13" fill="#d99400"/><circle r="10" fill="#ffd23f"/><use href="#star" fill="#fff3b0" transform="scale(.42)"/></g>
  <g transform="translate(590 100)"><circle r="11" fill="#d99400"/><circle r="8.5" fill="#ffd23f"/><use href="#star" fill="#fff3b0" transform="scale(.35)"/></g>
  <!-- sparkle trail -->
  <g>
    <circle cx="120" cy="250" r="4" fill="#ff4d6d"/><circle cx="96" cy="262" r="3" fill="#ffd93d"/><circle cx="74" cy="244" r="3.5" fill="#4dabff"/>
    <circle cx="54" cy="258" r="2.5" fill="#6bdb6b"/><circle cx="34" cy="248" r="2" fill="#c56cf0"/>
  </g>
  <!-- unicorn (flying, facing right) -->
  <g transform="translate(270 230) rotate(-8) scale(2.1)">
    <circle cx="0" cy="-10" r="60" fill="url(#glow)"/>
    <g fill="none" stroke-width="7" stroke-linecap="round">
      <path d="M-38-8Q-62-22-86-6" stroke="#ff4d6d"/><path d="M-38-8Q-62-16-86 1" stroke="#ff9f43"/>
      <path d="M-38-8Q-62-10-86 8" stroke="#6bdb6b"/><path d="M-38-8Q-62-4-86 15" stroke="#4dabff"/><path d="M-38-8Q-62 2-86 22" stroke="#c56cf0"/>
    </g>
    <g stroke-width="10" stroke-linecap="round">
      <path d="M-20 12l-16 22M24 12l16 22" stroke="#e6dcf7"/>
      <path d="M-30 14l-16 22M32 14l16 22" stroke="#fff"/>
    </g>
    <g fill="#c9a0ff"><circle cx="-36" cy="36" r="5.5"/><circle cx="40" cy="36" r="5.5"/><circle cx="-46" cy="38" r="5.5"/><circle cx="48" cy="38" r="5.5"/></g>
    <ellipse rx="44" ry="26" fill="#fbf7ff"/>
    <path d="M24-6L44-36" stroke="#fbf7ff" stroke-width="24" stroke-linecap="round"/>
    <g><circle cx="36" cy="-56" r="8" fill="#ff4d6d"/><circle cx="32" cy="-49" r="8" fill="#ff9f43"/><circle cx="28" cy="-41" r="8" fill="#ffd93d"/>
      <circle cx="24" cy="-34" r="8" fill="#6bdb6b"/><circle cx="20" cy="-27" r="8" fill="#4dabff"/><circle cx="16" cy="-19" r="8" fill="#6c63ff"/><circle cx="12" cy="-12" r="8" fill="#c56cf0"/></g>
    <ellipse cx="54" cy="-42" rx="22" ry="15" fill="#fff" transform="rotate(26 54 -42)"/>
    <ellipse cx="66" cy="-33" rx="9" ry="10" fill="#ffe1ef"/>
    <path d="M41-52L38-68 50-57z" fill="#fff"/><path d="M42-55L40-64 47-58z" fill="#ffc6dd"/>
    <path d="M45-55L63-88 55-58z" fill="url(#horn)"/>
    <ellipse cx="51" cy="-45" rx="3.6" ry="4.6" fill="#2b1a45"/><circle cx="52.2" cy="-46.5" r="1.3" fill="#fff"/>
    <circle cx="58" cy="-36" r="4.5" fill="#ff82b4" fill-opacity=".45"/>
    <g transform="translate(-4 -18) rotate(-30)">
      <ellipse cx="-26" cy="-8" rx="22" ry="9" fill="#dff0ff" transform="rotate(-12 -26 -8)"/>
      <ellipse cx="-18" cy="-11" rx="27" ry="9" fill="#f3e6ff" transform="rotate(-30 -18 -11)"/>
      <ellipse cx="-10" cy="-14" rx="32" ry="9" fill="#fff" transform="rotate(-52 -10 -14)"/>
    </g>
  </g>
</svg>
