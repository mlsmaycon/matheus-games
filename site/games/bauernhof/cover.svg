    <ellipse cx="-20" cy="-14" rx="18" ry="12" fill="#222"/><ellipse cx="30" cy="6" rx="14" ry="10" fill="#222"/>
    <rect x="-52" y="22" width="12" height="34" fill="#fff"/><rect x="-26" y="22" width="12" height="34" fill="#fff"/><rect x="18" y="22" width="12" height="34" fill="#fff"/><rect x="42" y="22" width="12" height="34" fill="#fff"/>
    <rect x="52" y="-56" width="46" height="44" rx="10" fill="#fff"/>
    <rect x="58" y="-24" width="38" height="16" rx="7" fill="#ffc8c8"/>
    <circle cx="66" cy="-42" r="4" fill="#111"/><circle cx="86" cy="-42" r="4" fill="#111"/>
    <path d="M56 -56 L48 -70 M94 -56 L102 -70" stroke="#f2e2c4" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="0" cy="30" rx="14" ry="8" fill="#ffb0c0"/>
  </g>
  <!-- chicken -->
  <g transform="translate(330 268)">
    <ellipse rx="26" ry="22" fill="#fff"/><circle cx="18" cy="-22" r="13" fill="#fff"/>
    <path d="M14 -36 q4 -8 8 0 q4 -8 8 0" fill="#e8322e"/><polygon points="30,-24 42,-20 30,-16" fill="#ffa32e"/><circle cx="22" cy="-24" r="2.5" fill="#111"/>
    <path d="M-6 20 V34 M6 20 V34" stroke="#ffa32e" stroke-width="4"/>
  </g>
  <!-- egg + sheep -->
  <ellipse cx="380" cy="292" rx="9" ry="12" fill="#fff8ea"/>
  <g transform="translate(540 262)" fill="#f4f4f0"><circle r="24"/><circle cx="-20" cy="-6" r="16"/><circle cx="20" cy="-8" r="16"/><circle cy="-20" r="16"/><ellipse cx="30" cy="-2" rx="11" ry="13" fill="#2a2a2a"/></g>
  <!-- coins -->
  <g fill="#ffd23f" stroke="#c99a10" stroke-width="3"><circle cx="70" cy="360" r="16"/><circle cx="100" cy="368" r="16"/><circle cx="84" cy="342" r="16"/></g>
