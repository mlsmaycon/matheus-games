<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#d8f0ff"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fcc58"/><stop offset="1" stop-color="#4f9e33"/></linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#sky)"/>
  <circle cx="560" cy="64" r="32" fill="#fff3a0"/>
  <g fill="#fff"><ellipse cx="120" cy="70" rx="46" ry="16"/><ellipse cx="150" cy="60" rx="30" ry="16"/><ellipse cx="380" cy="50" rx="40" ry="13"/></g>
  <path d="M0 210 Q160 170 320 200 T640 190 L640 400 L0 400 Z" fill="url(#grass)"/>
  <!-- barn -->
  <g transform="translate(400 120)">
    <rect x="0" y="60" width="170" height="110" fill="#c8402c"/>
    <polygon points="-12,62 85,0 182,62" fill="#8a2618"/>
    <rect x="58" y="100" width="54" height="70" fill="#f4e6c8"/>
    <path d="M58 100 L112 170 M112 100 L58 170" stroke="#c8402c" stroke-width="6"/>
    <rect x="70" y="70" width="30" height="22" fill="#f4e6c8"/>
  </g>
  <!-- fence -->
  <g stroke="#a87a4a" stroke-width="7" stroke-linecap="round">
    <path d="M20 300 L620 300 M20 324 L620 324"/>
    <path d="M40 290 V340 M110 290 V340 M180 290 V340 M250 290 V340 M320 290 V340 M390 290 V340 M460 290 V340 M530 290 V340 M600 290 V340"/>
  </g>
  <!-- cow -->
  <g transform="translate(150 230)">
