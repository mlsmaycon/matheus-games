<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" shape-rendering="crispEdges">
  <rect width="640" height="400" fill="#7fd3ff"/>
  <g fill="#ffffff"><rect x="60" y="40" width="80" height="24"/><rect x="80" y="24" width="48" height="16"/><rect x="430" y="56" width="96" height="24"/><rect x="456" y="40" width="40" height="16"/></g>
  <!-- stone wall -->
  <rect y="150" width="640" height="90" fill="#8a8f99"/>
  <g fill="#6c717a"><rect y="180" width="640" height="4"/><rect y="210" width="640" height="4"/>
    <rect x="40" y="150" width="4" height="30"/><rect x="140" y="150" width="4" height="30"/><rect x="240" y="150" width="4" height="30"/><rect x="340" y="150" width="4" height="30"/><rect x="440" y="150" width="4" height="30"/><rect x="540" y="150" width="4" height="30"/>
    <rect x="90" y="184" width="4" height="26"/><rect x="190" y="184" width="4" height="26"/><rect x="290" y="184" width="4" height="26"/><rect x="390" y="184" width="4" height="26"/><rect x="490" y="184" width="4" height="26"/><rect x="590" y="184" width="4" height="26"/></g>
  <!-- grass -->
  <rect y="240" width="640" height="160" fill="#5fae3f"/>
  <g fill="#4f9e33"><rect x="20" y="260" width="16" height="8"/><rect x="120" y="300" width="16" height="8"/><rect x="260" y="270" width="16" height="8"/><rect x="520" y="290" width="16" height="8"/><rect x="420" y="340" width="16" height="8"/><rect x="60" y="360" width="16" height="8"/></g>
  <!-- portal -->
  <rect x="270" y="130" width="100" height="120" fill="#2a1a4a"/><rect x="286" y="146" width="68" height="104" fill="#b06aff"/><rect x="300" y="160" width="40" height="76" fill="#d8b8ff"/>
  <!-- slime -->
  <g transform="translate(120 250)"><rect width="96" height="80" fill="#5fd35f"/><rect x="16" y="32" width="64" height="40" fill="#2f8a3a"/><rect x="16" y="16" width="16" height="20" fill="#111"/><rect x="64" y="16" width="16" height="20" fill="#111"/><rect x="32" y="50" width="32" height="8" fill="#111"/></g>
  <!-- robot -->
  <g transform="translate(430 150)"><rect x="10" y="0" width="60" height="44" fill="#7a8498"/><rect x="18" y="16" width="44" height="10" fill="#3ad7ff"/><rect x="36" y="-20" width="8" height="20" fill="#ff3d3d"/>
    <rect y="44" width="80" height="80" fill="#a8b4c8"/><rect x="80" y="60" width="44" height="18" fill="#3a4060"/><rect x="8" y="124" width="24" height="60" fill="#55595f"/><rect x="48" y="124" width="24" height="60" fill="#55595f"/></g>
  <!-- bat -->
  <g transform="translate(470 60)"><rect x="-40" y="10" width="40" height="10" fill="#4a2a78"/><rect x="40" y="10" width="40" height="10" fill="#4a2a78"/><rect width="40" height="34" fill="#7a4ab8"/><rect x="8" y="10" width="8" height="8" fill="#ff3d3d"/><rect x="24" y="10" width="8" height="8" fill="#ff3d3d"/></g>
  <!-- laser + crosshair -->
  <rect x="330" y="296" width="210" height="6" fill="#3ad7ff" transform="rotate(-26 330 300)"/>
  <g fill="#ffffff"><rect x="316" y="276" width="8" height="40"/><rect x="300" y="292" width="40" height="8"/></g>
  <!-- blaster in hand -->
  <g transform="translate(360 300)"><rect x="0" y="20" width="200" height="56" fill="#e8ecf8"/><rect x="-60" y="30" width="70" height="20" fill="#3ad7ff"/><rect x="40" y="0" width="120" height="20" fill="#3ad7ff"/><rect x="140" y="76" width="44" height="40" fill="#3a4060"/><rect x="200" y="30" width="60" height="36" fill="#c8cfe8"/></g>
  <!-- cube burst -->
  <g fill="#9cff3a"><rect x="230" y="230" width="12" height="12"/><rect x="250" y="210" width="10" height="10"/><rect x="214" y="206" width="10" height="10"/></g>
  <g fill="#ffd23f"><rect x="238" y="190" width="14" height="14"/><rect x="580" y="250" width="14" height="14"/></g>
</svg>
