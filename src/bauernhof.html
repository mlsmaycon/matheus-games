<title>Mein Bauernhof</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: farm column – coin strip, 3D farmyard seen from above, shop panel slides over the yard, buttons below. Look: meadow green, barn red, straw yellow. */
:root{
  --grass:#5fae3f;
  --grass-dark:#2f6e22;
  --barn:#c8402c;
  --barn-dark:#8a2618;
  --straw:#f4cf5c;
  --ink:#2a2216;
  --panel:#fffaf0;
  --muted:#6b5a3e;
  --display:"Arial Rounded MT Bold","SF Pro Rounded",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --body:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{background:#e8f4d4;color:var(--ink)}
body{font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1;margin:0;color:var(--barn);text-shadow:3px 3px 0 #fff;letter-spacing:.5px;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-weight:800;font-size:13px;color:var(--muted);text-shadow:none;margin-top:8px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--panel);border-radius:12px;padding:6px 12px;min-width:84px}
.stat span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800}
.stat b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 14px 40px #2a221640;aspect-ratio:16/10;max-width:100%;background:#9fd6ff;touch-action:none;user-select:none;-webkit-user-select:none}
@media (max-width:640px){.stage{aspect-ratio:4/5}}
.stage canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:12px;color:#fff;-webkit-text-stroke:3px #2a2216;paint-order:stroke fill;will-change:transform;text-align:center;line-height:1.15}
.lb small{display:block;font-size:11px}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:6px;pointer-events:none;flex-wrap:wrap}
.pill{background:#2a2216e0;color:#fff;border-radius:999px;padding:5px 12px;font-family:var(--display);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.pill.coins{color:#ffd23f}
.pill.clock{margin-left:auto}
#joy{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:#ffffff50;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#ffffffc0}
#act{position:absolute;right:14px;bottom:14px;min-width:84px;height:84px;padding:0 10px;border-radius:42px;border:0;background:var(--barn);color:#fff;font-family:var(--display);font-weight:800;font-size:14px;box-shadow:0 5px 0 var(--barn-dark);cursor:pointer;line-height:1.1}
#act:active{transform:translateY(3px);box-shadow:0 2px 0 var(--barn-dark)}
#act[hidden]{display:none}
#toasts{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:64%}
.toast{background:#2a2216ee;color:#fff;font-weight:800;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--c,#ffd23f);animation:pop .25s ease-out;text-align:center}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:#f4fbe8ec;text-align:center;overflow:auto}
.screen h2{font-family:var(--display);font-weight:800;font-size:clamp(32px,6vw,54px);margin:0;color:var(--barn);text-shadow:3px 3px 0 #fff;text-wrap:balance}
.screen p{margin:0;max-width:58ch;font-size:16px;line-height:1.5}
.go{font-family:var(--display);font-weight:800;font-size:22px;border:0;border-radius:16px;padding:14px 30px;cursor:pointer;background:var(--barn);color:#fff;box-shadow:0 5px 0 var(--barn-dark)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--barn-dark)}
#shop{position:absolute;left:10px;right:10px;top:50px;bottom:10px;background:var(--panel);border-radius:16px;box-shadow:0 10px 30px #2a221660;display:flex;flex-direction:column;overflow:hidden;max-width:620px;margin:0 auto}
#shop header{padding:12px 14px;background:var(--barn);color:#fff;align-items:center;flex-wrap:nowrap}
#shop h3{margin:0;font-family:var(--display);font-size:20px}
#shop .x{border:0;background:#ffffff30;color:#fff;font-weight:800;font-size:18px;width:36px;height:36px;border-radius:50%;cursor:pointer;flex:none}
#shopList{overflow:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px}
#shopList h4{margin:8px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 10px;border:2px solid #f0e3c6}
.row .ic{font-size:26px;width:34px;text-align:center;flex:none}
.row .tx{flex:1;min-width:0;font-size:13px;line-height:1.35}
.row .tx b{font-size:15px;display:block}
.row button{flex:none;border:0;border-radius:10px;padding:8px 10px;font-family:var(--display);font-weight:800;font-size:13px;color:#fff;background:var(--grass-dark);box-shadow:0 3px 0 #1d4715;cursor:pointer;min-width:96px}
.row button:disabled{background:#b9ad95;box-shadow:0 3px 0 #8d8270;cursor:default}
.row button.lock{background:#b07a1c;box-shadow:0 3px 0 #7a520e}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--display);font-weight:800;font-size:16px;border:0;border-radius:14px;padding:10px 16px;cursor:pointer;color:#fff;background:var(--grass-dark);box-shadow:0 4px 0 #1d4715;flex:1 1 150px}
.btn.alt{background:#7d6a4d;box-shadow:0 4px 0 #574830}
.btn:active{transform:translateY(3px)}
.btn:focus-visible,.go:focus-visible,#act:focus-visible,.row button:focus-visible,#shop .x:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.help{margin:0;color:var(--muted);font-size:14px;line-height:1.55;max-width:80ch}
.help b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

</div>

function addAnimal(s,silent){
  const P=penObj[s];const mesh=buildAnimal(s);
  const a={s,x:P.px+(Math.random()-0.5)*(PW-3),z:P.pz+(Math.random()-0.5)*(PD-3),tx:0,tz:0,wait:Math.random()*3,face:Math.random()*6,moving:0,
    t:SPECIES[s].period*(0.5+Math.random()*0.5),ct:SPECIES[s].period*(1.5+Math.random()),item:null,coin:null,mesh};
  a.tx=a.x;a.tz=a.z;P.animals.push(a);
  if(!silent){mesh.scale.setScalar(0.1);a.pop=0;}
  return a;
}

  const sp=SPECIES[a.s],m=ITEM_MODEL[sp.item]();const g=new THREE.Group();g.add(m);

function visitorTick(v,dt){

  const dx=v.tgt.x-v.x,dz=v.tgt.z-v.z,d=Math.hypot(dx,dz);

function tone(type,f1,f2,start,dur,vol){
  if(!actx||!soundOn)return;
  const t0=actx.currentTime+start,o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+dur+0.05);
}

function nearest(){
  const d=(x,z)=>Math.hypot(x-player.x,z-player.z);
  if(d(SHOP.x,SHOP.z+1.2)<2.6)return {k:'shop'};
  if(d(WELL.x,WELL.z)<2.6)return {k:'well'};
  for(const s of ORDER){const P=penObj[s];if(S.pens[s].open&&d(P.trough.x,P.trough.z)<1.9)return {k:'trough',s};}
  for(let i=0;i<plotsOpen();i++)if(Math.abs(PLOTS[i].x-player.x)<1.8&&Math.abs(PLOTS[i].z-player.z)<1.8){const st=S.plots[i].st;return {k:st===0?'plant':st===2?'harvest':'grow',i};}
  return null;
}
function use(){
  if(!playing)return;audioInit();
  if(shopOpen){closeShop();return;}
  const n=nearest();if(!n)return;
  if(n.k==='shop'){openShop();}
  else if(n.k==='well'){S.water=bucketCap();sfx.splash();toast(t('gotWater'),'#4fb3ff');save();}
  else if(n.k==='trough')fillTrough(n.s);
  else if(n.k==='plant'){S.plots[n.i]={st:1,t:GROW};sfx.plant();toast(t('planted'),'#e8c060');save();}
  else if(n.k==='harvest'){if(S.feed>=FEED_MAX()){sfx.no();toast(t('feedFull'),'#ff8f80');return;}S.plots[n.i]={st:0,t:0};S.feed=Math.min(FEED_MAX(),S.feed+HARVEST);sfx.pick();toast(t('harvested',{n:HARVEST}),'#e8c060');save();}
}
function fillTrough(s){
  const P=S.pens[s];if(!P.open)return false;
  const needF=TROUGH_MAX-P.food,needW=TROUGH_MAX-P.water;
  if(needF<=0&&needW<=0){toast(t('troughFull'),'#ffd23f');return false;}
  const f=Math.min(needF,S.feed),w=Math.min(needW,S.water);
  if(f<=0&&w<=0){sfx.no();toast(t('noSupplies'),'#ff8f80');if(S.water<=0)tip(3);return false;}
  P.food+=f;P.water+=w;S.feed-=f;S.water-=w;sfx.splash();toast(t('filled'),'#9be36a');save();return true;
}

let time=0,saveT=0,wasNight=false;
const isNight=()=>{const f=(S.time%DAY_LEN)/DAY_LEN;return f>0.78||f<0.04;};
function clockStr(){const f=(S.time%DAY_LEN)/DAY_LEN,m=Math.floor(f*24*60)+6*60;const hh=Math.floor(m/60)%24,mm=Math.floor(m%60/10)*10;return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
function update(dt){
  time+=dt;resetArm=Math.max(0,resetArm-dt);if(resetArm<=0&&$('reset').textContent!==t('reset'))$('reset').textContent=t('reset');
  // Tag und Nacht
  const prevDay=Math.floor(S.time/DAY_LEN);S.time+=dt;const nd=Math.floor(S.time/DAY_LEN);
  if(nd>prevDay){S.day++;sfx.rooster();toast(t('newDay',{d:S.day}),'#ffd23f');const b=morningBonus();if(b){S.coins+=b;setTimeout(()=>toast(t('bonus',{n:b}),'#ffd23f'),700);}save();}
  const night=isNight();if(night&&!wasNight)toast(t('night'),'#9fb0ff');wasNight=night;
  // Bewegung
  let ix=0,iz=0;
  if(!shopOpen){if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;if(keys.w||keys.arrowup)iz-=1;if(keys.s||keys.arrowdown)iz+=1;
    if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>8){ix=dx/Math.max(d,46);iz=dy/Math.max(d,46);}}}
  const il=Math.hypot(ix,iz);player.moving=0;
  if(il>0.05){const n=Math.min(1,il);ix/=il;iz/=il;player.x+=ix*speed()*n*dt;player.z+=iz*speed()*n*dt;player.face=Math.atan2(ix,iz);player.moving=1;}
  player.x=Math.max(-29,Math.min(29,player.x));player.z=Math.max(-21,Math.min(29,player.z));
  // Haus, Stände und Brunnen sind fest
  [[0,-25,5.4,3.4],[STAND.x,STAND.z,2.4,1],[SHOP.x,SHOP.z,2.4,1]].forEach(([cx,cz,hx,hz])=>{const dx=player.x-cx,dz=player.z-cz;if(Math.abs(dx)<hx&&Math.abs(dz)<hz){if(hx-Math.abs(dx)<hz-Math.abs(dz))player.x=cx+Math.sign(dx)*hx;else player.z=cz+Math.sign(dz)*hz;}});
  {const dx=player.x-WELL.x,dz=player.z-WELL.z,d=Math.hypot(dx,dz);if(d<1.5&&d>0){player.x=WELL.x+dx/d*1.5;player.z=WELL.z+dz/d*1.5;}}
  if(shopOpen&&Math.hypot(SHOP.x-player.x,SHOP.z+1.2-player.z)>3.5)closeShop();
  // Pony folgt
  if(pony){const dx=player.x-pony.x,dz=player.z-pony.z,d=Math.hypot(dx,dz);pony.moving=0;if(d>1.8){const st=Math.min(d-1.8,speed()*1.05*dt);pony.x+=dx/d*st;pony.z+=dz/d*st;pony.face=Math.atan2(dx,dz);pony.moving=1;}}
  // Einsammeln
  for(const it of items.slice()){if(Math.hypot(it.x-player.x,it.z-player.z)<1.2){
    if(it.type==='coin'){S.coins+=it.value;removeItem(it);sfx.coin();toast(t('coinDrop',{n:it.value}),'#ffd23f');continue;}
    if(basket.length>=basketCap()){if(!it.warned){it.warned=1;toast(t('basketFull'),'#ff8f80');}continue;}
    basket.push({type:it.type,value:it.value});removeItem(it);sfx.pick();toast(t('picked',{i:t('i_'+it.type)}),'#ffd23f');tip(4);}}
  // Verkaufen am Hofladen
  if(basket.length&&Math.hypot(STAND.x-player.x,STAND.z+1.2-player.z)<2.8)sellAll();
  // Tiere
  ORDER.forEach(s=>{const P=penObj[s],D=S.pens[s];
    P.animals.forEach(a=>{
      if(a.pop!==undefined){a.pop=Math.min(1,a.pop+dt*2.5);a.mesh.scale.setScalar(0.1+0.9*a.pop);if(a.pop>=1)delete a.pop;}
      a.moving=0;
      if(night){/* schlafen */}
      else{a.wait-=dt;if(a.wait<=0){a.tx=P.px+(Math.random()-0.5)*(PW-2.5);a.tz=P.pz+(Math.random()-0.5)*(PD-2.5);a.wait=3+Math.random()*5;}
        const dx=a.tx-a.x,dz=a.tz-a.z,d=Math.hypot(dx,dz);if(d>0.2){const st=Math.min(d,1.2*dt);a.x+=dx/d*st;a.z+=dz/d*st;a.face=Math.atan2(dx,dz);a.moving=1;}}
      // Produktion: braucht Futter und Wasser im Trog, nachts langsamer
      if(!a.coin&&D.food>=1&&D.water>=1){a.ct-=dt*(night?0.4:1);if(a.ct<=0){dropCoin(a);a.ct=SPECIES[s].period*(1.5+Math.random());}}
      if(!a.item&&D.food>=1&&D.water>=1){a.t-=dt*(night?0.4:1);if(a.t<=0){D.food-=1;D.water-=1;dropItem(a);a.t=SPECIES[s].period*(0.85+Math.random()*0.3);}}
    });
  });
  if(S.tap)ORDER.forEach(s=>{const D=S.pens[s];if(D.open)D.water=Math.min(TROUGH_MAX,D.water+dt*0.5);});
  // Besucher kommen tagsüber; je mehr Tiere, desto öfter
  const nA=animalsTotal();
  if(nA>0&&!night){visitT-=dt;if(visitT<=0&&visitors.length<Math.min(8,2+Math.floor(nA/3))){spawnVisitor();visitT=Math.max(5,26-nA*1.5)*(0.7+Math.random()*0.6);}}
  visitors.slice().forEach(v=>{if(night&&v.step<v.plan.length&&v.wait<=0){v.step=v.plan.length;v.tgt={x:GATE.x,z:GATE.z+1};}visitorTick(v,dt);});
  // Weizen
  S.plots.forEach(p=>{if(p.st===1){p.t-=dt;if(p.t<=0){p.st=2;p.t=0;}}});
  saveT+=dt;if(saveT>5){saveT=0;save();}
}
function animWalker(e,sp){
  const m=e.mesh,u=m.userData;m.position.set(e.x,0,e.z);
  let d=e.face-m.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));m.rotation.y+=d*0.25;
  const sw=e.moving?Math.sin(time*(sp||14))*0.6:0;
  if(u.legs.length===2){u.legs[0].rotation.x=sw;u.legs[1].rotation.x=-sw;}else if(u.legs.length===4){u.legs[0].rotation.x=sw;u.legs[3].rotation.x=sw;u.legs[1].rotation.x=-sw;u.legs[2].rotation.x=-sw;}
  if(u.arms){u.arms[0].rotation.x=-sw;u.arms[1].rotation.x=sw;}
}
const camPos=new THREE.Vector3(0,16,26),camLook=new THREE.Vector3();
function render(){
  animWalker(player);if(pony)animWalker(pony,12);visitors.forEach(v=>animWalker(v,11));
  player.mesh.userData.basket.scale.setScalar(basket.length?1+Math.min(1,basket.length/basketCap())*0.5:1);
  ORDER.forEach(s=>penObj[s].animals.forEach(a=>{animWalker(a,10);a.mesh.userData.inner.rotation.z=isNight()?0.25:0;}));
  for(const it of items){it.mesh.position.y=Math.abs(Math.sin(time*3+it.bob))*0.12;it.mesh.rotation.y+=0.02;}
  // Tröge
  ORDER.forEach(s=>{const P=penObj[s],D=S.pens[s];P.tap.visible=S.tap&&D.open;P.food.scale.y=0.1+3*D.food/TROUGH_MAX;P.food.visible=D.food>0;P.water.scale.y=0.1+3*D.water/TROUGH_MAX;P.water.visible=D.water>0;});
  // Weizen
  plotMeshes.forEach((m,i)=>{m.visible=i<plotsOpen();const p=S.plots[i];const w=m.userData.wheat;w.visible=p.st>0;const k=p.st===2?1:p.st===1?0.15+0.85*(1-p.t/GROW):0;w.scale.set(1,Math.max(0.05,k),1);
    w.children.forEach((c,j)=>{if(j%2)c.material=M(p.st===2?'#f0cf5a':'#8fcf4a');});});
  // Tag und Nacht
  const f=(S.time%DAY_LEN)/DAY_LEN;let dayK;
  if(f<0.04)dayK=f/0.04*0.6+0.0;else if(f<0.7)dayK=1;else if(f<0.78)dayK=1-(f-0.7)/0.08;else dayK=0;
  const sky=SKY_NIGHT.clone().lerp(SKY_DAY,dayK);if(f>0.66&&f<0.82)sky.lerp(SKY_EVE,0.35*Math.sin((f-0.66)/0.16*Math.PI));
  scene.background.copy(sky);scene.fog.color.copy(sky);
  hemi.intensity=0.3+0.45*dayK;sun.intensity=0.15+0.7*dayK;
  // Kamera
  camPos.lerp(new THREE.Vector3(player.x*0.85,16,player.z+15),0.1);camera.position.copy(camPos);
  camLook.lerp(new THREE.Vector3(player.x*0.9,0,player.z-1),0.12);camera.lookAt(camLook);
  sun.target.position.set(player.x,0,player.z);sun.target.updateMatrixWorld();sun.position.set(player.x-20,40,player.z+20);
  renderer.render(scene,camera);
  // Beschriftungen
  used=0;
  lab(t('shopSign'),SHOP.x,3.8,SHOP.z,'#ffd23f');lab(t('standSign'),STAND.x,3.8,STAND.z,'#9be36a');lab(t('wellSign'),WELL.x,4.0,WELL.z,'#9fd6ff');
  lab(t('fieldSign'),0,2.2,-19.5,'#f0cf5a');if(S.standLv)lab(t('standLv',{n:S.standLv+1}),STAND.x,4.5,STAND.z,'#ffd23f');lab(t('houseSign'),0,10.2,-25,'#ffffff');
  ORDER.forEach(s=>{const P=penObj[s],D=S.pens[s];
    if(!D.open){lab(`${t('p_'+s)}<small>${t('lockedPen')} · ${t('coins',{n:SPECIES[s].unlock})}</small>`,P.px,2.6,P.pz,'#ffb35c');return;}
    let sub=D.n?`${D.n}/${D.cap}`:t('emptyPen');
    if(D.n&&D.food<1)sub+=' · '+t('hungry');else if(D.n&&D.water<1)sub+=' · '+t('thirsty');
    lab(`${t('p_'+s)}<small>${sub}</small>`,P.px,3.4,P.pz-PD/2,(D.n&&(D.food<1||D.water<1))?'#ff8f80':'#ffffff');
    if(Math.hypot(P.trough.x-player.x,P.trough.z-player.z)<9)lab(t('troughInfo',{f:Math.floor(D.food),w:Math.floor(D.water)}),P.trough.x,1.5,P.trough.z,'#ffe9a8');
  });
  const n=playing&&!shopOpen?nearest():null;let act='';
  if(n){const map={shop:['eShop','actShop'],well:['eWell','actWell'],trough:['eTrough','actTrough'],plant:['ePlant','actPlant'],harvest:['eHarvest','actHarvest']};
    if(n.k==='grow'){const p=PLOTS[n.i];lab(t('eGrow',{s:Math.ceil(S.plots[n.i].t)}),p.x,2,p.z,'#9be36a');}
    else{const [lk,ak]=map[n.k];act=t(ak);lab(t(lk),player.x,2.6,player.z,'#ffd23f');}}
  const ab=$('act');ab.hidden=!act;if(act&&ab.textContent!==act)ab.textContent=act;
  for(let i=used;i<pool.length;i++)pool[i].style.display='none';
  visitors.forEach(v=>{if(v.sayT>0)lab(v.say,v.x,2.3,v.z,v.say===t('vSad')?'#ff8f80':'#ffb0d8');});
  for(let i=used;i<pool.length;i++)pool[i].style.display='none';
  // HUD
  $('hCoins').textContent=t('hCoins',{n:S.coins});$('hFeed').textContent=t('hFeed',{n:S.feed});$('hWater').textContent=t('hWater',{n:S.water,m:bucketCap()});
  $('hBasket').textContent=t('hBasket',{n:basket.length,m:basketCap()});$('hClock').textContent=t('clock',{d:S.day,t:clockStr()});
  $('sCoins').textContent=S.coins;$('sAnimals').textContent=animalsTotal();$('sDay').textContent=S.day;
}
let last=performance.now(),acc=0;
function loop(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  if(playing){acc+=dt;let n=0;while(acc>=1/60&&n<6){update(1/60);acc-=1/60;n++;}if(n===6)acc=0;}
  render();requestAnimationFrame(loop);
}

/* ---------- Start ---------- */
function startGame(){audioInit();$('startScreen').hidden=true;playing=true;last=performance.now();if(animalsTotal()===0)tip(1);save();}
$('go').addEventListener('click',startGame);
restoreAnimals();if(S.pony)pony=buildPony();showHouse();showStand();resize();
window.__bh={spawnVisitor,get visitors(){return visitors},get S(){return S},get player(){return player},get items(){return items},get basket(){return basket},penObj,PLOTS,SHOP,STAND,WELL,
  buyAnimal,buildPen,upgradeFarm,expandPen,buyFeed,fillTrough,sellAll,use,openShop,closeShop,get shopOpen(){return shopOpen},
  tick:sec=>{for(let i=0;i<sec*60;i++)update(1/60);},get playing(){return playing}};
requestAnimationFrame(loop);
})();
</script>
