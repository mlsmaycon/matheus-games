  const solids = [];   // blocks the cat sideways, top can be stood on

    const sky = canvasTex(128, 128, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#7ec8ff'); gr.addColorStop(1, '#d6f0ff'); g.fillStyle = gr; g.fillRect(0, 0, w, h); g.fillStyle = '#7bd389'; g.fillRect(0, h * 0.78, w, h); g.fillStyle = '#fff'; g.beginPath(); g.arc(40, 40, 12, 0, 7); g.arc(56, 34, 16, 0, 7); g.arc(72, 42, 11, 0, 7); g.fill(); });

    const scolding = owner.state === 'scold';
    ownM.arms[1].rotation.x = scolding ? -2.6 + Math.sin(time * 18) * 0.15 : sw * 0.8;
    ownM.mouth.scale.set(scolding ? 0.6 : 1, scolding ? 4 : 1, 1);
    // camera: behind the cat, kept inside the house
    let dist = 2.7, height = 1.25 * camPitch / 0.38;
    if (state === 'title') { camTarget.set(4.5, 0.5, 0.9); dist = 3.4; height = 1.3; }
    else camTarget.set(cat.x, cat.y + 0.35, cat.z);
    let cx = camTarget.x + Math.sin(camYaw) * dist, cz = camTarget.z + Math.cos(camYaw) * dist;
    const cy = clamp(camTarget.y + height, 0.3, WALL + 0.6);
    cx = clamp(cx, 0.25, HX - 0.25); cz = clamp(cz, 0.25, HZ - 0.25);
    if ((cx - 10) * (camTarget.x - 10) < 0 && (cz < DOOR_Z1 || cz > DOOR_Z2)) cx = camTarget.x < 10 ? 9.75 : 10.25;
    camWant.set(cx, cy, cz);
    if (state === 'play') camera.position.lerp(camWant, 0.18); else camera.position.copy(camWant);
    if (shake > 0) camera.position.add(new THREE.Vector3(rand(-0.03, 0.03), rand(-0.03, 0.03), 0));
    camera.lookAt(camTarget);
    renderer.render(scene, camera);
    // HUD
    if (state !== 'title') {
      $('hearts').textContent = '♥'.repeat(Math.max(0, hearts)) + '♡'.repeat(Math.max(0, 3 - hearts));
      $('score').textContent = score;
      $('dayLbl').textContent = t('day', { n: day });
      $('goalBar').style.width = Math.min(100, knocked / goal * 100) + '%';
      $('goalTxt').textContent = t('goal', { n: Math.min(knocked, goal), m: goal });
      const s = Math.ceil(timer); $('timer').textContent = `⏱ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      $('timer').style.color = timer < 20 && Math.floor(time * 2) % 2 ? '#ff6b6b' : '';
      $('warn').hidden = !(state === 'play' && owner.state === 'away' && owner.warned);
      $('warn').textContent = t('coming');
      $('hiddenTag').hidden = !(state === 'play' && cat.hidden); $('hiddenTag').textContent = t('hidden');
      const b = $('bubble');
      if (owner.speechT > 0 && owner.state !== 'away') {
        const p = toScreen(owner.x, 2.05, owner.z);
        b.hidden = !p.front; b.textContent = owner.speech; b.style.left = clamp(p.x, 8, 92) + '%'; b.style.top = clamp(p.y, 12, 95) + '%';
      } else b.hidden = true;
      const ban = $('banner');
      ban.style.opacity = state === 'play' && stateT < 2.6 ? Math.min(1, 2.6 - stateT) : 0;
      ban.innerHTML = `${t('day', { n: day })}<small>${t('dayGoal', { n: goal })}</small>`;
    }
    stage.dataset.state = state; stage.dataset.score = score; stage.dataset.knocked = knocked; stage.dataset.hearts = hearts;
    stage.dataset.catx = cat.x.toFixed(2); stage.dataset.catz = cat.z.toFixed(2); stage.dataset.caty = cat.y.toFixed(2); stage.dataset.owner = owner.state;
  }

  // ---------- input ----------
  const keyMap = { ArrowUp: 'fwd', KeyW: 'fwd', ArrowDown: 'back', KeyS: 'back', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', KeyC: 'crouch', ShiftLeft: 'crouch', ShiftRight: 'crouch', ControlLeft: 'crouch' };
  window.addEventListener('keydown', e => {
    if (!focused) return;
    if (keyMap[e.code]) { keys[keyMap[e.code]] = true; e.preventDefault(); return; }
    if (e.code === 'Space') { e.preventDefault(); if (e.repeat) return; if (state === 'play') jumpQ = true; else action(); return; }
    if (e.code === 'Enter') { if (state !== 'play') { e.preventDefault(); action(); } return; }
    if (['KeyE', 'KeyX', 'KeyF'].includes(e.code)) { if (!e.repeat && state === 'play') pawQ = true; return; }
    if (e.code === 'KeyM') $('mute').click();
  });
  window.addEventListener('keyup', e => { if (keyMap[e.code]) keys[keyMap[e.code]] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  document.addEventListener('pointerdown', e => { focused = stage.contains(e.target); });
  const cv = renderer.domElement;
  cv.addEventListener('focus', () => { focused = true; });
  // drag to turn the camera (mouse, or a finger on the free part of the screen)
  let drag = null;
  cv.addEventListener('pointerdown', e => {
    ensureAudio(); cv.focus({ preventScroll: true }); focused = true;
    if (e.pointerType === 'touch' && !touchMode) { touchMode = true; if (state === 'play') show(null); }
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  });
  cv.addEventListener('pointermove', e => {
    if (!drag || drag.id !== e.pointerId) return;
    const w = stage.clientWidth;
    camYaw -= (e.clientX - drag.x) / w * 4.2;
    camPitch = clamp(camPitch + (e.clientY - drag.y) / w * 1.6, 0.12, 0.9);
    drag.x = e.clientX; drag.y = e.clientY;
  });
  const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
  cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
  // touch joystick + buttons
  const joyEl = $('joy');
  const joyMove = e => {
    const r = joyEl.getBoundingClientRect(), R = r.width / 2;
    let dx = (e.clientX - r.left - R) / R, dy = (e.clientY - r.top - R) / R; const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
    joy.x = dx; joy.y = dy; joyEl.firstChild.style.transform = `translate(${dx * R * 0.6}px, ${dy * R * 0.6}px)`;
  };
  joyEl.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); joy.id = e.pointerId; try { joyEl.setPointerCapture(e.pointerId); } catch (_) {} joyMove(e); });
  joyEl.addEventListener('pointermove', e => { if (e.pointerId === joy.id) joyMove(e); });
  const joyEnd = e => { if (e.pointerId === joy.id) { joy.id = null; joy.x = joy.y = 0; joyEl.firstChild.style.transform = ''; } };
  joyEl.addEventListener('pointerup', joyEnd); joyEl.addEventListener('pointercancel', joyEnd);
  const hold = (id, on, off) => {
    const b = $(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); b.classList.add('on'); on(); });
    const up = () => { b.classList.remove('on'); if (off) off(); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
  };
  hold('tJump', () => { jumpQ = true; });
  hold('tPaw', () => { pawQ = true; });
  hold('tDuck', () => { tbtn.duck = true; }, () => { tbtn.duck = false; });

  // ---------- loop ----------
  toTitle();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    if (state === 'title') { Object.assign(cat, { x: 4.5, z: 0.7, y: 0.4, yaw: 0.3, ground: true, vx: 0, vz: 0, crouch: false, surf: null }); }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
