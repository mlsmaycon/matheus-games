<title>Pixel-Blaster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>window.MW_LANG='de';</script>
<style>
/* Layout: arcade column – title + stats, first-person 3D arena with HUD and crosshair, shop overlay between waves, controls below. Look: blocky pixel world, night-blue frame, lime and hot-pink accents. */
:root{
  --night:#141a33;
  --panel:#1f2747;
  --lime:#9cff3a;
  --pink:#ff3d8b;
  --gold:#ffd23f;
  --sky:#7fd3ff;
  --ink:#f2f5ff;
  --muted:#a9b3d6;
  --display:"Courier New",ui-monospace,"SF Mono",Menlo,monospace;
  --body:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,6vw,48px);line-height:1;margin:0;color:var(--lime);text-shadow:4px 4px 0 #000,4px 4px 0 var(--pink);letter-spacing:1px;text-transform:uppercase;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-weight:800;font-size:13px;color:var(--muted);text-shadow:none;margin-top:8px;text-transform:none;letter-spacing:0}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--panel);border:2px solid #000;box-shadow:3px 3px 0 #000;padding:6px 12px;min-width:84px}
.stat span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800}
.stat b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--gold)}
.stage{position:relative;overflow:hidden;border:4px solid #000;box-shadow:6px 6px 0 #000;aspect-ratio:16/10;max-width:100%;background:#7fd3ff;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
@media (max-width:640px){.stage{aspect-ratio:3/4}}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--display);font-weight:900;font-size:12px;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;will-change:transform;text-align:center}
.hpb{width:46px;height:6px;background:#000;border:1px solid #000;margin:2px auto 0}
.hpb i{display:block;height:100%;background:var(--lime)}
#cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none}
#cross::before,#cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 2px #000}
#cross::before{left:12px;top:2px;width:2px;height:22px}
#cross::after{top:12px;left:2px;height:2px;width:22px}
#cross.hit::before,#cross.hit::after{background:var(--pink)}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;flex-wrap:wrap}
.box{background:#000000b0;border:2px solid #000;color:#fff;padding:5px 10px;font-family:var(--display);font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
.hp{width:min(220px,40vw)}
.hp .bar{height:12px;background:#3a0d1d;margin-top:4px;border:2px solid #000}
.hp .bar i{display:block;height:100%;background:linear-gradient(#ff7aa8,#ff3d8b);transition:width .15s}
.coins{color:var(--gold)}
#ammoBox{position:absolute;right:10px;bottom:10px;text-align:right;pointer-events:none}
#ammoBox b{display:block;font-size:26px}
#ammoBox small{font-size:12px;color:var(--muted)}
#hurt{position:absolute;inset:0;pointer-events:none;background:radial-gradient(transparent 50%,#ff1e4e);opacity:0}
#banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:900;font-size:clamp(26px,5vw,46px);color:var(--lime);text-shadow:4px 4px 0 #000;text-align:center;pointer-events:none;white-space:nowrap}
#toasts{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:70%}
.toast{background:#000000d8;color:#fff;font-weight:800;font-size:14px;padding:6px 14px;border:2px solid var(--c,var(--lime));text-align:center;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:#141a33e8;text-align:center;overflow:auto}
.screen h2{font-family:var(--display);font-weight:900;font-size:clamp(30px,6vw,52px);margin:0;color:var(--lime);text-shadow:4px 4px 0 #000;text-transform:uppercase;text-wrap:balance}
.screen p{margin:0;max-width:60ch;font-size:16px;line-height:1.5}
.go{font-family:var(--display);font-weight:900;font-size:22px;border:3px solid #000;padding:12px 28px;cursor:pointer;background:var(--lime);color:#000;box-shadow:5px 5px 0 #000;text-transform:uppercase}
.go:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}
#shop{justify-content:flex-start}
#shop .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;width:100%;max-width:860px}
.card{background:var(--panel);border:3px solid #000;box-shadow:4px 4px 0 #000;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.card b{font-family:var(--display);font-size:16px;color:var(--gold)}
.card span{font-size:13px;color:var(--muted);line-height:1.35}
.card button{border:2px solid #000;background:var(--lime);color:#000;font-weight:900;font-size:14px;padding:7px;cursor:pointer;box-shadow:3px 3px 0 #000}
.card button:disabled{background:#4a5274;color:#a9b3d6;cursor:default}
.card button.eq{background:var(--sky)}
.card.on{outline:3px solid var(--lime)}
#shop h3{margin:6px 0 0;font-family:var(--display);color:var(--pink);text-transform:uppercase;font-size:16px;align-self:flex-start;max-width:860px;width:100%}
#touch{position:absolute;inset:0;pointer-events:none;display:none}
.touch #touch{display:block}
#touch button{position:absolute;pointer-events:auto;border:3px solid #000;background:#ffffffb0;color:#000;font-weight:900;font-family:var(--display);border-radius:50%;width:64px;height:64px;font-size:12px}
#tFire{right:18px;bottom:90px;width:84px!important;height:84px!important;background:#ff3d8bd0!important;color:#fff!important}
#tJump{right:112px;bottom:30px}
#tSwap{right:18px;bottom:190px}
#tReload{right:112px;bottom:120px}
#joy{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:#ffffff40;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#ffffffb0}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--display);font-weight:900;font-size:15px;border:3px solid #000;padding:10px 16px;cursor:pointer;color:#000;background:var(--sky);box-shadow:4px 4px 0 #000;flex:1 1 150px}
.btn.alt{background:#c8cfe8}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.btn:focus-visible,.go:focus-visible,.card button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.help{margin:0;color:var(--muted);font-size:14px;line-height:1.55;max-width:80ch}
.help b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<div class="app">
  <header>
    <h1>Pixel-Blaster<small data-t="sub">Pixel-Monster greifen an – halte so viele Wellen durch, wie du kannst!</small></h1>
    <div class="stats">
      <div class="stat"><span data-t="statCoins">Münzen</span><b id="sCoins">0</b></div>
      <div class="stat"><span data-t="statBest">Beste Welle</span><b id="sBest">0</b></div>
      <div class="stat"><span data-t="statWeapons">Waffen</span><b id="sWeapons">1</b></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <div id="labels"></div>
    <div id="hurt"></div>
    <div id="cross"></div>
    <div class="hud">
      <div class="box hp"><span id="hHp">100</span><div class="bar"><i id="hHpBar" style="width:100%"></i></div></div>
      <div class="box coins" id="hCoins">0</div>
      <div class="box" id="hWave">…</div>
    </div>
    <div class="box" id="ammoBox"><small id="hWeapon"></small><b id="hAmmo">12 / 12</b></div>
    <div id="banner"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="touch"><div id="joy" hidden><i></i></div>
      <button id="tFire" type="button" data-t="tFire">Feuer</button><button id="tJump" type="button" data-t="tJump">Hüpf</button>
      <button id="tSwap" type="button" data-t="tSwap">Waffe</button><button id="tReload" type="button" data-t="tReload">Laden</button></div>
    <div class="screen" id="shop" hidden>
      <h2 id="shopTitle">Shop</h2>
      <p id="shopSub"></p>
      <button class="go" id="nextWave" type="button" data-t="nextWave">Nächste Welle</button>
      <h3 data-t="shopWeapons">Waffen</h3>
      <div class="list" id="shopWeapons"></div>
      <h3 data-t="shopUpgrades">Verbesserungen</h3>
      <div class="list" id="shopUpgrades"></div>
    </div>
    <div class="screen" id="pauseScreen" hidden>
      <h2 data-t="paused">Pause</h2>
      <button class="go" id="resume" type="button" data-t="resume">Weiter</button>
    </div>
    <div class="screen" id="overScreen" hidden>
      <h2 data-t="overTitle">Besiegt!</h2>
      <p id="overText"></p>
      <button class="go" id="again" type="button" data-t="again">Nochmal</button>
    </div>
    <div class="screen" id="startScreen">
      <h2 data-t="title">Pixel-Blaster</h2>
      <p data-t="intro"></p>
      <button class="go" id="go" type="button" data-t="go">Los geht’s</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="sound" type="button" aria-pressed="true" data-t="soundOn">Ton an · M</button>
    <button class="btn alt" id="reset" type="button" data-t="reset">Alles zurücksetzen</button>
  </div>
  <p class="help" data-t="help" data-html="1"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const LANG=((window.MW_LANG||document.documentElement.lang||'de')+'').slice(0,2)==='en'?'en':'de';
const TXT={
  de:{
    title:'Pixel-Blaster',sub:'Pixel-Monster greifen an – halte so viele Wellen durch, wie du kannst!',statCoins:'Münzen',statBest:'Beste Welle',statWeapons:'Waffen',
    intro:'Die Pixel-Arena wird von Monstern überrannt: Schleime, Fledermäuse, Roboter und ab und zu ein riesiger Pixel-Golem! Triff sie mit deinem Blaster – dann zerfallen sie in Pixel und lassen Münzen fallen. Nach jeder Welle kaufst du im Shop neue Waffen und Verbesserungen.',
    go:'Los geht’s',soundOn:'Ton an · M',soundOff:'Ton aus · M',reset:'Alles zurücksetzen',resetSure:'Wirklich? Nochmal klicken',
    help:'<b>Steuerung:</b> Ins Spielfeld klicken, dann mit der <b>Maus</b> umschauen und mit der <b>linken Maustaste</b> schießen. <b>WASD</b> / Pfeiltasten laufen, <b>Leertaste</b> springt (auch auf Kisten), <b>R</b> lädt nach, <b>1–6</b> oder das <b>Mausrad</b> wechseln die Waffe, <b>P</b> macht Pause, <b>M</b> schaltet den Ton um. Auf dem Handy oder Tablet: links ziehen zum Laufen, rechts ziehen zum Umschauen, Knöpfe zum Schießen, Springen, Nachladen und Waffe wechseln. Die Monster sind Pixel-Fantasiewesen und zerfallen in bunte Würfel – kein Blut.',
    noload:'3D konnte nicht geladen werden.',
    tFire:'Feuer',tJump:'Hüpf',tSwap:'Waffe',tReload:'Laden',
    hp:'Leben {n}',wave:'Welle {w} · Monster {n}',waveBreak:'Welle {w} geschafft!',ammo:'{a} / {m}',reloading:'Lädt …',
    waveStart:'Welle {w}',bossWave:'BOSS-WELLE!',waveDone:'Welle geschafft! +{c} Münzen',
    nextWave:'Nächste Welle',shopWeapons:'Waffen',shopUpgrades:'Verbesserungen',shopTitle:'Shop',shopSub:'Du hast {c} Münzen. Welle {w} wartet.',
    buy:'Kaufen · {p}',equip:'Ausrüsten',equipped:'In der Hand',owned:'Gekauft',
    w_pistol:'Pixel-Pistole',w_shotgun:'Block-Schrotflinte',w_laser:'Laser-Gewehr',w_sniper:'Präzisions-Blaster',w_rocket:'Konfetti-Raketenwerfer',w_mini:'Regenbogen-Minigun',
    wd_pistol:'Zuverlässig, 12 Schuss.',wd_shotgun:'6 Pixel-Kugeln auf einmal – stark von nah.',wd_laser:'Dauerfeuer! Gedrückt halten.',wd_sniper:'Ein Schuss, viel Schaden – ideal gegen Roboter.',wd_rocket:'Explodiert in Konfetti und trifft alle in der Nähe.',wd_mini:'Riesiges Magazin, Regenbogen-Dauerfeuer!',
    stat:'Schaden {d} · Magazin {m}',
    u_hp:'Mehr Leben',ud_hp:'+25 maximale Leben (jetzt {n}).',u_dmg:'Stärkere Blaster',ud_dmg:'+10 % Schaden für alle Waffen (jetzt +{n} %).',u_heal:'Heiltrank',ud_heal:'Füllt deine Leben ganz auf.',
    e_slime:'Schleim',e_bat:'Fledermaus',e_robot:'Roboter',e_golem:'Pixel-Golem',
    paused:'Pause',resume:'Weiter',overTitle:'Besiegt!',overText:'Du hast bis Welle {w} durchgehalten. Deine Münzen und Waffen behältst du.',again:'Nochmal',
    newBest:'Neuer Rekord: Welle {w}!',bought:'{x} gekauft!',poor:'Dafür brauchst du {p} Münzen.',heart:'+25 Leben',
    resetDone:'Alles zurückgesetzt.',clickLook:'Klick ins Spielfeld, um mit der Maus zu zielen.',bossDown:'Der Pixel-Golem ist besiegt! +{c} Münzen'
  },
  en:{
    title:'Pixel Blaster',sub:'Pixel monsters are attacking – survive as many waves as you can!',statCoins:'Coins',statBest:'Best wave',statWeapons:'Weapons',
    intro:'The pixel arena is overrun by monsters: slimes, bats, robots and now and then a giant pixel golem! Hit them with your blaster – they break into pixels and drop coins. After every wave you buy new weapons and upgrades in the shop.',
    go:'Let’s go',soundOn:'Sound on · M',soundOff:'Sound off · M',reset:'Reset everything',resetSure:'Really? Click again',
    help:'<b>Controls:</b> Click the playfield, then look around with the <b>mouse</b> and shoot with the <b>left mouse button</b>. <b>WASD</b> / arrow keys move, <b>Space</b> jumps (onto crates too), <b>R</b> reloads, <b>1–6</b> or the <b>mouse wheel</b> switch weapons, <b>P</b> pauses, <b>M</b> toggles sound. On a phone or tablet: drag on the left to move, drag on the right to look, buttons to shoot, jump, reload and switch weapons. The monsters are pixel fantasy creatures and break into colourful cubes – no blood.',
    noload:'3D could not be loaded.',
    tFire:'Fire',tJump:'Jump',tSwap:'Swap',tReload:'Reload',
    hp:'Health {n}',wave:'Wave {w} · Monsters {n}',waveBreak:'Wave {w} cleared!',ammo:'{a} / {m}',reloading:'Reloading …',
    waveStart:'Wave {w}',bossWave:'BOSS WAVE!',waveDone:'Wave cleared! +{c} coins',
    nextWave:'Next wave',shopWeapons:'Weapons',shopUpgrades:'Upgrades',shopTitle:'Shop',shopSub:'You have {c} coins. Wave {w} is waiting.',
    buy:'Buy · {p}',equip:'Equip',equipped:'In your hand',owned:'Owned',
    w_pistol:'Pixel Pistol',w_shotgun:'Block Shotgun',w_laser:'Laser Rifle',w_sniper:'Sniper Blaster',w_rocket:'Confetti Rocket Launcher',w_mini:'Rainbow Minigun',
    wd_pistol:'Reliable, 12 shots.',wd_shotgun:'6 pixel pellets at once – strong up close.',wd_laser:'Full auto! Hold to fire.',wd_sniper:'One shot, lots of damage – great against robots.',wd_rocket:'Explodes into confetti and hits everyone nearby.',wd_mini:'Huge magazine, rainbow full auto!',
    stat:'Damage {d} · Magazine {m}',
    u_hp:'More health',ud_hp:'+25 max health (now {n}).',u_dmg:'Stronger blasters',ud_dmg:'+10 % damage for all weapons (now +{n} %).',u_heal:'Healing potion',ud_heal:'Fills your health all the way up.',
    e_slime:'Slime',e_bat:'Bat',e_robot:'Robot',e_golem:'Pixel Golem',
    paused:'Paused',resume:'Resume',overTitle:'Defeated!',overText:'You made it to wave {w}. You keep your coins and weapons.',again:'Play again',
    newBest:'New record: wave {w}!',bought:'{x} bought!',poor:'You need {p} coins for that.',heart:'+25 health',
    resetDone:'Everything reset.',clickLook:'Click the playfield to aim with the mouse.',bossDown:'The pixel golem is defeated! +{c} coins'
  }
};
const t=(k,v)=>{let s=(TXT[LANG][k]??TXT.de[k]??k);if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s;};
document.querySelector('h1').firstChild.textContent=t('title');
document.querySelectorAll('[data-t]').forEach(el=>{const k=el.getAttribute('data-t');if(el.dataset.html)el.innerHTML=t(k);else el.textContent=t(k);});
$('shopTitle').textContent=t('shopTitle');
if(!window.THREE){$('hWave').textContent=t('noload');return;}
const isTouch=('ontouchstart' in window)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
if(isTouch)$('stage').classList.add('touch');

/* ---------- Waffen und Daten ---------- */
const WEAPONS=[
  {id:'pistol',price:0,dmg:22,rate:0.28,mag:12,reload:1.0,spread:0.004,pellets:1,auto:false,col:'#9cff3a',body:'#3a4060'},
  {id:'shotgun',price:150,dmg:11,rate:0.75,mag:6,reload:1.4,spread:0.07,pellets:6,auto:false,col:'#ff9f2e',body:'#7a4a2a'},
  {id:'laser',price:400,dmg:10,rate:0.085,mag:40,reload:1.6,spread:0.012,pellets:1,auto:true,col:'#3ad7ff',body:'#e8ecf8'},
  {id:'sniper',price:800,dmg:130,rate:1.1,mag:5,reload:1.8,spread:0,pellets:1,auto:false,col:'#ff3d8b',body:'#22283e'},
  {id:'rocket',price:1500,dmg:75,rate:1.1,mag:3,reload:2.0,spread:0,pellets:1,auto:false,col:'#ffd23f',body:'#3fa84a',rocket:true},
  {id:'mini',price:3000,dmg:8,rate:0.045,mag:150,reload:2.4,spread:0.03,pellets:1,auto:true,col:'#ffffff',body:'#b06aff',rainbow:true}
];
const W_BY={};WEAPONS.forEach(w=>W_BY[w.id]=w);
const ENEMY={
  slime:{hp:40,speed:2.6,dmg:10,coins:5,col:'#5fd35f',size:1.0},
  bat:{hp:26,speed:5.2,dmg:6,coins:7,col:'#7a4ab8',size:0.8,fly:true},
  robot:{hp:75,speed:2.2,dmg:9,coins:12,col:'#a8b4c8',size:1.1,ranged:true},
  golem:{hp:900,speed:1.5,dmg:22,coins:150,col:'#8a7a6a',size:2.6,boss:true}
};
const KEY='pixel-blaster-v1';
let store=null;try{store=window.localStorage;store.getItem(KEY);}catch(e){store=null;}
function fresh(){return {coins:0,owned:['pistol'],cur:'pistol',hpLv:0,dmgLv:0,best:0};}
let S=fresh();
try{const s=store&&JSON.parse(store.getItem(KEY)||'null');if(s&&typeof s.coins==='number'){S=Object.assign(fresh(),s);S.owned=(S.owned||[]).filter(id=>W_BY[id]);if(!S.owned.includes('pistol'))S.owned.unshift('pistol');if(!W_BY[S.cur])S.cur='pistol';}}catch(e){S=fresh();}
function save(){try{store&&store.setItem(KEY,JSON.stringify(S));}catch(e){}}
const maxHp=()=>100+S.hpLv*25;
const dmgMul=()=>1+S.dmgLv*0.1;
const upCost=k=>k==='hp'?200*(S.hpLv+1):k==='dmg'?250*(S.dmgLv+1):30;

/* ---------- Three.js ---------- */
const stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.autoClear=false;
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color('#7fd3ff');
scene.fog=new THREE.Fog('#7fd3ff',40,95);
const camera=new THREE.PerspectiveCamera(72,1.6,0.05,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x5a7a3a,0.75));
const sun=new THREE.DirectionalLight(0xfff2d6,0.75);sun.position.set(-30,50,20);scene.add(sun);
// Waffe in der Hand: eigene kleine Szene, damit sie nie in Wände ragt
const gunScene=new THREE.Scene();gunScene.add(new THREE.HemisphereLight(0xffffff,0x444466,1.0));
const gunSun=new THREE.DirectionalLight(0xffffff,0.6);gunSun.position.set(1,2,1);gunScene.add(gunSun);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);

// Pixel-Texturen (16×16, scharf)
function pixTex(pal,pattern){
  const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){g.fillStyle=pattern?pattern(x,y,pal):pal[(Math.random()*pal.length)|0];g.fillRect(x,y,1,1);}
  const tx=new THREE.CanvasTexture(c);tx.magFilter=THREE.NearestFilter;tx.minFilter=THREE.NearestFilter;tx.wrapS=tx.wrapT=THREE.RepeatWrapping;return tx;
}
const TEX={
  grass:pixTex(['#5fae3f','#4f9e33','#6cbf47','#57a83a','#73c84f']),

const matCache={};
function texMat(name){if(!matCache[name])matCache[name]=new THREE.MeshLambertMaterial({map:TEX[name]});return matCache[name];}
function texBox(w,h,d,tex,tile){ // Würfel mit Pixel-Textur, Kachel ~tile Meter
  tile=tile||2;const geo=new THREE.BoxGeometry(w,h,d);const uv=geo.attributes.uv;
  const dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++)for(let k=0;k<4;k++){const i=f*4+k;uv.setXY(i,uv.getX(i)*dims[f][0]/tile,uv.getY(i)*dims[f][1]/tile);}
  return new THREE.Mesh(geo,texMat(tex));
}
const mats={};
function M(c){if(!mats[c])mats[c]=new THREE.MeshLambertMaterial({color:c});return mats[c];}
const BOX=new THREE.BoxGeometry(1,1,1);
function cube(col,sx,sy,sz,x,y,z){const m=new THREE.Mesh(BOX,typeof col==='string'?M(col):col);m.scale.set(sx,sy,sz);m.position.set(x,y,z);return m;}

let actx=null,soundOn=true,noiseBuf=null;
function audioInit(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C){actx=new C();noiseBuf=actx.createBuffer(1,actx.sampleRate*0.5,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}}if(actx&&actx.state==='suspended')actx.resume();}catch(e){actx=null;}}
function tone(type,f1,f2,start,dur,vol){if(!actx||!soundOn)return;const t0=actx.currentTime+start,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f1,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+dur+0.05);}
function noise(dur,vol,freq){if(!actx||!soundOn||!noiseBuf)return;const t0=actx.currentTime,s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);s.connect(f);f.connect(g);g.connect(actx.destination);s.start(t0);s.stop(t0+dur+0.05);}

function rayHit(origin,dir,maxD){ // nächster Treffer: Monster (Kasten) oder Wand
  let best=null,bd=maxD||120;
  for(const s of solids){const box=new THREE.Box3(new THREE.Vector3(s.x0,0,s.z0),new THREE.Vector3(s.x1,s.top,s.z1));const p=new THREE.Ray(origin,dir).intersectBox(box,new THREE.Vector3());if(p){const d=p.distanceTo(origin);if(d<bd){bd=d;best={wall:true,p};}}}
  for(const e of enemies){const box=new THREE.Box3(new THREE.Vector3(e.x-e.r,e.y,e.z-e.r),new THREE.Vector3(e.x+e.r,e.y+e.h,e.z+e.r));const p=new THREE.Ray(origin,dir).intersectBox(box,new THREE.Vector3());if(p){const d=p.distanceTo(origin);if(d<bd){bd=d;best={e,p};}}}
  if(!best&&dir.y<0){const d=-origin.y/dir.y;if(d<bd)best={wall:true,p:origin.clone().add(dir.clone().multiplyScalar(d))};}
  if(!best)best={p:origin.clone().add(dir.clone().multiplyScalar(bd))};
  return best;
}

let time=0;
function update(dt){
  time+=dt;resetArm=Math.max(0,resetArm-dt);if(resetArm<=0&&$('reset').textContent!==t('reset'))$('reset').textContent=t('reset');
  bannerT=Math.max(0,bannerT-dt);if(bannerT<=0)$('banner').textContent='';
  for(const c of clouds){c.position.x+=c.userData.sp*dt;if(c.position.x>90)c.position.x=-90;}
  PORTALS.forEach((p,i)=>p.g.userData.glow.material.opacity=0.45+Math.sin(time*3+i)*0.2);
  if(state!=='fight'||paused){effects(dt);return;}
  // Bewegung

  if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;if(keys.w||keys.arrowup)iz-=1;if(keys.s||keys.arrowdown)iz+=1;

    const E=ENEMY[e.type],dx=px-e.x,dz=pz-e.z,d=Math.hypot(dx,dz)||1;e.face=Math.atan2(dx,dz);e.hitT=Math.max(0,e.hitT-dt);e.cd-=dt;

    if(!blk(e.x,e.z+mz))e.z+=mz;else if(!blk(e.x+Math.sign(mx||1)*Math.abs(mz),e.z))e.x+=Math.sign(mx||1)*Math.abs(mz);

}

  // HUD
  const w=W_BY[S.cur];$('hHp').textContent=t('hp',{n:Math.ceil(player.hp)});$('hHpBar').style.width=(player.hp/maxHp()*100)+'%';
  $('hCoins').textContent='$ '+S.coins;$('hWave').textContent=state==='fight'?t('wave',{w:wave,n:enemies.length+toSpawn.length}):state==='shop'?t('waveBreak',{w:wave-1}):t('waveStart',{w:wave});
  $('hWeapon').textContent=t('w_'+w.id);$('hAmmo').textContent=reloadT>0?t('reloading'):t('ammo',{a:ammo[w.id],m:w.mag});
  $('hurt').style.opacity=player.hurtT>0?player.hurtT/0.35*0.8:0;$('cross').classList.toggle('hit',hitT>0);
  renderStats();
}
function renderStats(){$('sCoins').textContent=S.coins;$('sBest').textContent=S.best;$('sWeapons').textContent=S.owned.length+'/'+WEAPONS.length;}
let last=performance.now(),acc=0;
function loop(now){const dt=Math.min(0.1,(now-last)/1000);last=now;acc+=dt;let n=0;while(acc>=1/60&&n<6){update(1/60);acc-=1/60;n++;}if(n===6)acc=0;render();requestAnimationFrame(loop);}

/* ---------- Start ---------- */
$('go').addEventListener('click',()=>{audioInit();$('startScreen').hidden=true;player.hp=maxHp();startWave();if(!isTouch)setTimeout(()=>{if(!locked)toast(t('clickLook'),'#3ad7ff');},1200);});
equipGun();resize();renderStats();
window.__pb={get S(){return S},get player(){return player},get enemies(){return enemies},get wave(){return wave},get state(){return state},get ammo(){return ammo},
  spawn:type=>spawnEnemy(type,wave),fire,damage,killAll:()=>enemies.slice().forEach(e=>killEnemy(e)),clearQueue:()=>{toSpawn=[];},
  aimAt:e=>{const dx=e.x-player.x,dz=e.z-player.z,dy=(e.y+e.h/2)-(player.y+EYE);player.yaw=Math.atan2(-dx,-dz);player.pitch=Math.atan2(dy,Math.hypot(dx,dz));},
  buyWeapon,switchWeapon,buyUp,startWave,tick:sec=>{for(let i=0;i<sec*60;i++)update(1/60);},hurt};
requestAnimationFrame(loop);
})();
</script>
