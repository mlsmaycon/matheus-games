<title>Meine Stadt</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: town column – title + stats, 3D town seen from behind your avatar, phone menu slides over the town, buttons below. Look: sunny suburb, asphalt grey, mint and sunset-orange accents, phone in deep plum. */
:root{
  --mint:#3fc9a3;
  --mint-dark:#21876b;
  --sunset:#ff8a3d;
  --sunset-dark:#c2581a;
  --plum:#2b2140;
  --paper:#fffaf3;
  --ink:#1f1a2b;
  --muted:#6a6280;
  --display:"Arial Rounded MT Bold","SF Pro Rounded",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --body:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{background:#e9f6f1;color:var(--ink)}
body{font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1;margin:0;color:var(--mint-dark);text-shadow:3px 3px 0 #fff;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-weight:800;font-size:13px;color:var(--muted);text-shadow:none;margin-top:8px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--paper);border-radius:12px;padding:6px 12px;min-width:84px}
.stat span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800}
.stat b{font-family:var(--display);font-size:18px}
.stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 14px 40px #1f1a2b40;aspect-ratio:16/10;max-width:100%;background:#9fd6ff;touch-action:none;user-select:none;-webkit-user-select:none}
@media (max-width:640px){.stage{aspect-ratio:4/5}}
.stage canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:12px;color:#fff;-webkit-text-stroke:3px #1f1a2b;paint-order:stroke fill;will-change:transform;text-align:center;line-height:1.15}
.lb.say{-webkit-text-stroke:0;background:#fff;color:var(--ink);padding:3px 8px;border-radius:10px;box-shadow:0 2px 0 #0002;font-size:12px}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:6px;pointer-events:none;flex-wrap:wrap;align-items:flex-start}
.pill{background:#1f1a2be0;color:#fff;border-radius:999px;padding:5px 12px;font-family:var(--display);font-weight:800;font-size:14px}
.pill.where{color:#9ff2da}
.pill.clock{margin-left:auto}
#phoneBtn{position:absolute;left:12px;bottom:12px;border:0;border-radius:14px;background:var(--plum);color:#fff;font-family:var(--display);font-weight:800;font-size:14px;padding:10px 14px;box-shadow:0 4px 0 #120c1f;cursor:pointer}
#act{position:absolute;right:14px;bottom:14px;min-width:84px;height:84px;padding:0 12px;border-radius:42px;border:0;background:var(--sunset);color:#fff;font-family:var(--display);font-weight:800;font-size:14px;box-shadow:0 5px 0 var(--sunset-dark);cursor:pointer;line-height:1.1}
#act:active,#phoneBtn:active{transform:translateY(3px)}
#act[hidden]{display:none}
#horn{position:absolute;right:108px;bottom:22px;width:64px;height:64px;border-radius:50%;border:0;background:#ffd23f;font-weight:800;font-family:var(--display);box-shadow:0 4px 0 #b8901a;cursor:pointer}
#horn[hidden]{display:none}
#joy{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:#ffffff50;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#ffffffc0}
#toasts{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:60%}
.toast{background:#1f1a2bee;color:#fff;font-weight:800;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--c,#3fc9a3);animation:pop .25s ease-out;text-align:center}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:#f1fbf7ec;text-align:center;overflow:auto}
.screen h2{font-family:var(--display);font-weight:800;font-size:clamp(32px,6vw,54px);margin:0;color:var(--mint-dark);text-shadow:3px 3px 0 #fff;text-wrap:balance}
.screen p{margin:0;max-width:58ch;font-size:16px;line-height:1.5}
.go{font-family:var(--display);font-weight:800;font-size:22px;border:0;border-radius:16px;padding:14px 30px;cursor:pointer;background:var(--sunset);color:#fff;box-shadow:0 5px 0 var(--sunset-dark)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sunset-dark)}
#phone{position:absolute;top:10px;bottom:10px;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 20px));background:var(--plum);border-radius:26px;padding:10px;box-shadow:0 12px 40px #0008;display:flex;flex-direction:column;gap:8px}
#phone .bar{display:flex;align-items:center;justify-content:space-between;color:#fff;font-family:var(--display);font-weight:800;padding:2px 6px}
#phone .x{border:0;background:#ffffff26;color:#fff;font-weight:800;font-size:16px;width:34px;height:34px;border-radius:50%;cursor:pointer}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{flex:1 1 auto;border:0;border-radius:10px;padding:8px 6px;font-weight:800;font-size:13px;background:#ffffff1c;color:#fff;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--mint);color:var(--ink)}
#appBody{flex:1;overflow:auto;background:var(--paper);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
#appBody h4{margin:4px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:2px solid #e3dccd;background:#fff;border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink)}
.chips button.on{border-color:var(--mint-dark);background:#dff6ee}
.chips button.sw{width:34px;height:34px;padding:0;border-radius:50%}
.chips button.sw.on{outline:3px solid var(--mint-dark);outline-offset:2px}
#appBody input{font:inherit;font-weight:800;padding:8px 10px;border-radius:10px;border:2px solid #e3dccd;width:100%;box-sizing:border-box}
.big{border:0;border-radius:12px;padding:10px;font-family:var(--display);font-weight:800;font-size:15px;background:var(--mint-dark);color:#fff;cursor:pointer}
.big.alt{background:#8a7fa3}
.note{font-size:13px;color:var(--muted);margin:0;line-height:1.4}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--display);font-weight:800;font-size:16px;border:0;border-radius:14px;padding:10px 16px;cursor:pointer;color:#fff;background:var(--mint-dark);box-shadow:0 4px 0 #145a47;flex:1 1 150px}
.btn.alt{background:#8a7fa3;box-shadow:0 4px 0 #5f567a}
.btn:active{transform:translateY(3px)}
.btn:focus-visible,.go:focus-visible,#act:focus-visible,#phoneBtn:focus-visible,.chips button:focus-visible,.tabs button:focus-visible,.big:focus-visible{outline:3px solid var(--sunset);outline-offset:2px}
.help{margin:0;color:var(--muted);font-size:14px;line-height:1.55;max-width:80ch}
.help b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<div class="app">
  <header>
    <h1>Meine Stadt<small data-t="sub">Such dir ein Haus, fahr Auto, nimm einen Job – die Stadt gehört dir!</small></h1>
    <div class="stats">
      <div class="stat"><span data-t="statName">Name</span><b id="sName">–</b></div>
      <div class="stat"><span data-t="statJob">Job</span><b id="sJob">–</b></div>
      <div class="stat"><span data-t="statHouse">Haus</span><b id="sHouse">–</b></div>

  <div class="stage" id="stage">
    <div id="labels"></div>
    <div class="hud">

      <span class="pill" id="hHold" hidden></span>
      <span class="pill clock" id="hClock">…</span>
    </div>
    <div id="joy" hidden><i></i></div>
    <button id="phoneBtn" type="button" data-t="phoneBtn">📱 Handy · Tab</button>
    <button id="horn" type="button" hidden data-t="hornBtn">Hupe</button>
    <button id="act" type="button" hidden></button>
    <div id="toasts" aria-live="polite"></div>
    <div id="phone" hidden role="dialog" aria-label="Handy">
      <div class="bar"><span id="phoneClock">12:00</span><button class="x" id="phoneClose" type="button" aria-label="Schließen">✕</button></div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="appBody"></div>
    </div>
    <div class="screen" id="startScreen">
      <h2 data-t="title">Meine Stadt</h2>
      <p data-t="intro"></p>
      <button class="go" id="go" type="button" data-t="go">Los geht’s</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="sound" type="button" aria-pressed="true" data-t="soundOn">Ton an · M</button>
    <button class="btn alt" id="reset" type="button" data-t="reset">Alles zurücksetzen</button>
  </div>
  <p class="help" data-t="help" data-html="1"></p>
</div>

const BUILDINGS=[];
function makeDoor(x,z,face){ // face: Richtung, in die die Tür zeigt (0=+z,1=-z,2=+x,3=-x)
  const d=[[0,1],[0,-1],[1,0],[-1,0]][face];return {x,z,nx:d[0],nz:d[1]};}
function bigBuilding(key,x,z,w,d,h,col,roofCol,face,sign){
  block(x,z,w,d,col,h);scene.add(part(G.box,roofCol,w+0.6,0.5,d+0.6,x,h+0.25,z));
  const door=makeDoor(x+(face===2?w/2:face===3?-w/2:0),z+(face===0?d/2:face===1?-d/2:0),face);
  const dm=part(G.box,'#5a3a22',face>=2?0.15:2.2,2.8,face>=2?2.2:0.15,door.x+door.nx*0.05,1.4,door.z+door.nz*0.05,false);scene.add(dm);
  // Fenster
  for(let i=0;i<Math.floor(w/4);i++)for(let j=0;j<Math.max(1,Math.floor(h/4));j++){const wx=x-w/2+2+i*4,wy=2+j*3.6;if(face<2&&Math.abs(wx-x)<2)continue;
    if(face<2)scene.add(part(G.box,windowsMat,1.6,1.4,0.1,wx,wy+0.6,door.z+door.nz*0.06,false));}
  const b={key,x,z,w,d,door,sign,interior:BUILDINGS.length};BUILDINGS.push(b);return b;
}

function leaveBuilding(){if(player.in<0)return;player.in=-1;const d=lastDoor;player.x=d.x+d.nx*2;player.z=d.z+d.nz*2;player.face=Math.atan2(d.nx,d.nz);player.sit=null;if(pet){pet.x=player.x+1;pet.z=player.z+1;}sfx.door();}
const roomOf=()=>player.in===HOME_IN?HOME:player.in>=0?BUILDINGS[player.in].room:null;

/* ---------- Was ist vor mir? ---------- */
function nearest(){
  const d=(x,z)=>Math.hypot(x-player.x,z-player.z);
  if(player.car)return {k:'out'};
  for(const c of cars)if(!c.npc&&c===myCar&&d(c.x,c.z)<Math.max(2.8,VEH[c.type].l/2+0.8))return {k:'car',c};
  const R=roomOf();
  if(R){if(d(R.exit.x,R.exit.z)<1.6)return {k:'exit'};
    let best=null,bd=1.5;for(const s of interact){if(s.room!==R)continue;const dd=d(s.x,s.z);if(dd<bd){bd=dd;best=s;}}if(best)return {k:'spot',s:best};return null;}
  for(const b of BUILDINGS)if(d(b.door.x+b.door.nx,b.door.z+b.door.nz)<2.2)return {k:'enter',b};
  for(const h of HOUSES){if(d(h.door.x+h.door.nx,h.door.z+h.door.nz)<2.4)return {k:h.i===S.house?'home':'claim',h};}
  if(d(PARK.x-6,PARK.z+5)<1.8)return {k:'slide'};if(d(PARK.x+3,PARK.z-1.5)<1.6)return {k:'swing'};
  return null;
}
function spotText(s){return s.k==='sit'?t('eSit'):s.k==='lie'?t('eLie'):s.k==='take'?t('eTake',{i:t('i_'+s.item)}):s.k==='tv'?t('eTv'):s.k==='board'?t('eBoard'):s.k==='bell'?t('eRing'):s.k==='cell'?t('eCell'):s.k==='pole'?t('eSlide'):'E';}
function use(){
  if(!playing)return;audioInit();if(phoneOpen){closePhone();return;}
  if(player.sit){player.sit=null;return;}
  const n=nearest();if(!n)return;
  if(n.k==='out')exitCar();
  else if(n.k==='car')enterCar(n.c);
  else if(n.k==='exit')leaveBuilding();
  else if(n.k==='enter')enterBuilding({b:n.b});
  else if(n.k==='home')enterBuilding({house:n.h});
  else if(n.k==='claim'){if(S.house>=0){const old=HOUSES[S.house];S.house=-1;buildHouse(old);}S.house=n.h.i;buildHouse(n.h);sfx.claim();toast(t('claimed'),'#3fc9a3');save();renderStats();}
  else if(n.k==='slide'){player.slide=1;sfx.take();}
  else if(n.k==='swing'){player.swing=4;player.x=PARK.x+3;player.z=PARK.z-1.5;}
  else if(n.k==='spot'){const s=n.s;
    if(s.k==='sit'||s.k==='lie'){player.sit=s;player.x=s.bed?s.bed.x:s.x;player.z=s.bed?s.bed.z:s.z;}
    else if(s.k==='take'){setHeld(s.item);sfx.take();}
    else if(s.k==='tv'){s.on=!s.on;s.room.tv.material.emissive.set(s.on?'#4fb3ff':'#000000');toast(t(s.on?'tvOn':'tvOff'),'#4fb3ff');sfx.pop();}
    else if(s.k==='board'){toast(t('board'),'#ffffff');sfx.pop();}
    else if(s.k==='bell'){toast(t('ring'),'#ffd23f');sfx.bell();}
    else if(s.k==='cell'){s.open=!s.open;s.room.cell.position.x=s.open?8.9+(s.room.ox?0:0)-1.3:8.9;toast(t(s.open?'cellOpen':'cellClose'),'#c8ccd4');sfx.door();}
    else if(s.k==='pole'){player.slide=1;sfx.take();}}
}
function blockedAt(x,z){for(const s of solids)if(x>s.x0-0.35&&x<s.x1+0.35&&z>s.z0-0.35&&z<s.z1+0.35)return true;return false;}
function carBlocked(c,x,z){const r=VEH[c.type].w/2;for(const s of solids)if(x>s.x0-r&&x<s.x1+r&&z>s.z0-r&&z<s.z1+r)return true;
  for(const o of cars)if(o!==c&&Math.hypot(o.x-x,o.z-z)<(VEH[o.type].w+VEH[c.type].w)/2+0.6)return true;return Math.abs(x)>R+20||Math.abs(z)>R+20;}

let time=0,saveT=0;const DAY_LEN=360;
const isNight=()=>{const f=(S.time%DAY_LEN)/DAY_LEN;return f>0.78||f<0.05;};
function clockStr(){const f=(S.time%DAY_LEN)/DAY_LEN,m=Math.floor(f*24*60)+6*60;return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(Math.floor(m%60/10)*10).padStart(2,'0');}
function update(dt){
  time+=dt;resetArm=Math.max(0,resetArm-dt);if(resetArm<=0&&$('reset').textContent!==t('reset'))$('reset').textContent=t('reset');
  const pd=Math.floor(S.time/DAY_LEN);S.time+=dt;if(Math.floor(S.time/DAY_LEN)>pd){S.day++;toast(t('newDay',{d:S.day}),'#ffd23f');save();}
  if(keys.q)camYaw+=dt*1.8;if(keys.r)camYaw-=dt*1.8;
  // Eingabe (relativ zur Kamera)
  let ix=0,iz=0;
  if(!phoneOpen){if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;if(keys.w||keys.arrowup)iz-=1;if(keys.s||keys.arrowdown)iz+=1;
    if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>8){ix=dx/Math.max(d,46);iz=dy/Math.max(d,46);}}}
  const c=player.car;
  if(c){ // Fahren: W/S Gas, A/D lenken
    const V=VEH[c.type];const gas=-iz;c.speed+=(gas>0?gas*V.max*0.8:gas<0?gas*V.max*1.2:-Math.sign(c.speed)*Math.min(Math.abs(c.speed),V.max*0.6*dt)/dt*0+0)*dt;
    if(!gas)c.speed-=Math.sign(c.speed)*Math.min(Math.abs(c.speed),8*dt);
    c.speed=Math.max(-V.max*0.4,Math.min(V.max,c.speed));
    if(Math.abs(c.speed)>0.3)c.face-=ix*dt*2.2*Math.sign(c.speed)*Math.min(1,Math.abs(c.speed)/6);
    const nx=c.x+Math.sin(c.face)*c.speed*dt,nz=c.z+Math.cos(c.face)*c.speed*dt;
    if(!carBlocked(c,nx,nz)){c.x=nx;c.z=nz;}else{c.speed*=-0.25;}
    player.x=c.x;player.z=c.z;if(Math.abs(c.speed)>1&&Math.random()<0.3)sfx.engine(c.speed);
    if(c.siren&&time%1<dt)sfx.siren();
  }else{
    const il=Math.hypot(ix,iz);player.moving=0;
    if(il>0.05&&!player.swing){if(player.sit)player.sit=null;const n=Math.min(1,il);ix/=il;iz/=il;const cs=Math.cos(camYaw),sn=Math.sin(camYaw);
      const wx=ix*cs+iz*sn,wz=-ix*sn+iz*cs,sp=6.5*n;const nx=player.x+wx*sp*dt,nz=player.z+wz*sp*dt;
      if(!blockedAt(nx,player.z))player.x=nx;if(!blockedAt(player.x,nz))player.z=nz;player.face=Math.atan2(wx,wz);player.moving=1;}
    const Rm=roomOf();if(Rm){player.x=Math.max(Rm.bounds.x0,Math.min(Rm.bounds.x1,player.x));player.z=Math.max(Rm.bounds.z0,Math.min(Rm.bounds.z1,player.z));
      if(player.z>Rm.exit.z+0.4)leaveBuilding();}
    else{player.x=Math.max(-R-15,Math.min(R+15,player.x));player.z=Math.max(-R-15,Math.min(R+15,player.z));}
  }
  if(player.swing){player.swing-=dt;if(player.swing<=0)player.swing=0;}
  if(player.slide){player.slide-=dt*1.2;if(player.slide<=0)player.slide=0;}
  // Haustier folgt
  if(pet&&!player.car){const dx=player.x-pet.x,dz=player.z-pet.z,d=Math.hypot(dx,dz);pet.moving=0;
    if(d>8){pet.x=player.x+1;pet.z=player.z+1;}else if(d>1.6){const st=Math.min(d-1.6,7*dt);pet.x+=dx/d*st;pet.z+=dz/d*st;pet.face=Math.atan2(dx,dz);pet.moving=1;}}
  // Leute laufen um die Blöcke
  for(const p of people){p.moving=0;p.sayT=Math.max(0,p.sayT-dt);
    if(p.wait>0){p.wait-=dt;}else{const tg=p.pts[(p.seg+1)%4],dx=tg[0]-p.x,dz=tg[1]-p.z,d=Math.hypot(dx,dz);
      if(d<0.3){p.seg=(p.seg+1)%4;if(Math.random()<0.3)p.wait=1+Math.random()*3;}else{const st=Math.min(d,2.2*dt);p.x+=dx/d*st;p.z+=dz/d*st;p.face=Math.atan2(dx,dz);p.moving=1;}}
    if(player.in<0&&!player.car&&Math.hypot(p.x-player.x,p.z-player.z)<3.5&&p.sayT<=0&&Math.random()<dt*0.6){const L=t('hello');say(p,L[(Math.random()*L.length)|0]);p.face=Math.atan2(player.x-p.x,player.z-p.z);p.wait=Math.max(p.wait,1.5);sfx.hi();}}
  // Autos der Stadt
  for(const c of cars){if(!c.npc)continue;const tg=c.pts[(c.seg+1)%4],dx=tg[0]-c.x,dz=tg[1]-c.z,d=Math.hypot(dx,dz);
    const ahead=[player,...cars.filter(o=>o!==c)].some(o=>{const ox=o.x-c.x,oz=o.z-c.z,od=Math.hypot(ox,oz);return od<7&&od>0.1&&(ox*dx+oz*dz)/(od*(d||1))>0.8&&!(o===player&&player.in>=0);});
    const want=ahead?0:9;c.speed+=(want-c.speed)*Math.min(1,dt*2);
    if(d<0.5){c.seg=(c.seg+1)%4;}else{const st=Math.min(d,c.speed*dt);c.x+=dx/d*st;c.z+=dz/d*st;const tf=Math.atan2(dx,dz);let df=tf-c.face;df=Math.atan2(Math.sin(df),Math.cos(df));c.face+=df*Math.min(1,dt*6);}}
  player.sayT=Math.max(0,player.sayT-dt);
  saveT+=dt;if(saveT>5){saveT=0;save();}
}
function animWalker(e,sp){const m=e.mesh,u=m.userData;m.position.set(e.x,0,e.z);let d=e.face-m.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));m.rotation.y+=d*0.25;
  const sw=e.moving?Math.sin(time*(sp||12))*0.6:0;if(u.legs&&u.legs.length===2){u.legs[0].rotation.x=sw;u.legs[1].rotation.x=-sw;}else if(u.legs&&u.legs.length===4){u.legs[0].rotation.x=sw;u.legs[3].rotation.x=sw;u.legs[1].rotation.x=-sw;u.legs[2].rotation.x=-sw;}
  if(u.arms){u.arms[0].rotation.x=-sw;u.arms[1].rotation.x=sw;}if(u.body){u.body.rotation.x=0;u.body.position.y=0.68;}}
const camPos=new THREE.Vector3(0,14,22),camLook=new THREE.Vector3();
function render(){
  // Spieler
  animWalker(player,12);const u=player.mesh.userData;
  if(player.sit){const s=player.sit;player.mesh.position.set(player.x,0,player.z);
    if(s.k==='lie'){player.mesh.rotation.set(-Math.PI/2,0,0);player.mesh.position.set(s.bed.x,s.bed.y,s.bed.z+0.8);}
    else{player.mesh.rotation.set(0,s.face||0,0);u.legs.forEach(l=>l.rotation.x=-Math.PI/2);u.body.position.y=0.68;player.mesh.position.y=(s.y||0.5)-0.6;}}
  else{player.mesh.rotation.x=0;player.mesh.rotation.z=0;
    if(player.swing){const a=Math.sin(time*3)*0.7;PARK.g.userData.swing.rotation.x=a;player.mesh.position.set(PARK.x+3,3.1-Math.cos(a)*2.2-0.6,PARK.z-1.5+Math.sin(a)*2.2);u.legs.forEach(l=>l.rotation.x=-Math.PI/2);}
    else{PARK.g.userData.swing.rotation.x*=0.95;}
    if(player.slide&&player.in<0){const k=1-player.slide;player.mesh.position.set(PARK.x-6,3-k*2.6,PARK.z+1+k*4);}
    if(player.slide&&player.in>=0){player.mesh.position.y=Math.max(0,3*player.slide);}}
  if(pet){animWalker(pet,14);if(pet.mesh.userData.hop)pet.mesh.position.y=pet.moving?Math.abs(Math.sin(time*10))*0.25:0;}
  people.forEach(p=>animWalker(p,10));
  for(const c of cars){c.m.g.position.set(c.x,0,c.z);c.m.g.rotation.y=c.face;const rs=(c.npc?c.speed:c.speed)*0.02;c.m.wheels.forEach(w=>w.rotation.x+=rs);
    c.m.sirens.forEach((s,k)=>{s.visible=!c.siren||Math.floor(time*6+k)%2===0;});}
  // Tag/Nacht
  const f=(S.time%DAY_LEN)/DAY_LEN;let dayK;if(f<0.05)dayK=f/0.05;else if(f<0.7)dayK=1;else if(f<0.78)dayK=1-(f-0.7)/0.08;else dayK=0;
  const sky=SKY_NIGHT.clone().lerp(SKY_DAY,dayK);if(f>0.66&&f<0.82)sky.lerp(SKY_EVE,0.35*Math.sin((f-0.66)/0.16*Math.PI));
  scene.background.copy(sky);scene.fog.color.copy(sky);hemi.intensity=0.35+0.4*dayK;sun.intensity=0.15+0.7*dayK;
  const lit=dayK<0.5;lampLights.forEach(l=>l.material.emissive.set(lit?'#ffe9a0':'#000000'));windowsMat.emissive.set(lit?'#806020':'#000000');
  // Kamera
  const tx=player.car?player.car.x:player.x,tz=player.car?player.car.z:player.z,dist=player.car?(VEH[player.car.type].l>6?22:18):(player.in>=0?11:15),hgt=player.car?11:(player.in>=0?10:9.5);
  const want=new THREE.Vector3(tx+Math.sin(camYaw)*dist,hgt,tz+Math.cos(camYaw)*dist);
  const jump=camPos.distanceTo(want)>60;if(jump)camPos.copy(want);else camPos.lerp(want,0.1);camera.position.copy(camPos);
  const lk=new THREE.Vector3(tx,1.2,tz);if(jump)camLook.copy(lk);else camLook.lerp(lk,0.15);camera.lookAt(camLook);
  sun.position.set(tx-25,45,tz+25);sun.target.position.set(tx,0,tz);
  renderer.render(scene,camera);
  // Beschriftungen
  used=0;
  lab(esc(S.name),player.mesh.position.x,player.sit&&player.sit.k==='lie'?2:3.1,player.mesh.position.z,'#9ff2da');
  if(player.sayT>0)lab(esc(player.say),player.x,3.9,player.z,'', 'say');
  if(pet&&S.petName&&!player.car)lab(esc(S.petName),pet.x,1.6,pet.z,'#ffd23f');
  if(player.in<0){
    people.forEach(p=>{if(Math.hypot(p.x-player.x,p.z-player.z)<28){lab(p.name,p.x,2.9,p.z,'#ffffff');if(p.sayT>0)lab(esc(p.say),p.x,3.7,p.z,'','say');}});
    BUILDINGS.forEach(b=>{if(Math.hypot(b.x-tx,b.z-tz)<70)lab(`${b.sign} ${t('b_'+b.key)}`,b.door.x+b.door.nx,4.4,b.door.z+b.door.nz,'#ffd23f');});
    HOUSES.forEach(h=>{if(Math.hypot(h.x-tx,h.z-tz)<60)lab(h.i===S.house?`🏠 ${t('myHouse')}`:`${t('houseN',{n:h.i+1})}<small>${t('free')}</small>`,h.door.x+h.door.nx*2,4.2,h.door.z+h.door.nz*2,h.i===S.house?'#9ff2da':'#7be34f');});
  }
  const n=playing&&!phoneOpen?nearest():null;let act='';
  if(n){const m={out:['','actOut'],car:['eCar','actCar'],exit:['eExit','actExit'],enter:['eEnter','actEnter'],home:['eEnter','actEnter'],claim:['eClaim','actClaim'],slide:['eSlide','actUse'],swing:['eSwing','actUse']};
    if(n.k==='spot'){act=n.s.k==='take'?t('actTake'):n.s.k==='sit'||n.s.k==='lie'?t('actSit'):t('actUse');lab(spotText(n.s),n.s.x,2.4,n.s.z,'#ffd23f');}
    else{const [lk,ak]=m[n.k];act=t(ak);if(lk)lab(t(lk),player.x,3.7,player.z,'#ffd23f');}}
  if(player.sit)act=t('actExit');
  const ab=$('act');ab.hidden=!act;if(act&&ab.textContent!==act)ab.textContent=act;$('horn').hidden=!player.car;
  for(let i=used;i<pool.length;i++)pool[i].style.display='none';
  // HUD
  $('hWhere').textContent=player.car?t('v_'+player.car.type):player.in===HOME_IN?t('inside',{b:t('myHouse')}):player.in>=0?t('inside',{b:t('b_'+BUILDINGS[player.in].key)}):t('town');
  $('hClock').textContent=t('clock',{d:S.day,t:clockStr()});$('phoneClock').textContent=clockStr();
}
let last=performance.now(),acc=0;
function loop(now){const dt=Math.min(0.1,(now-last)/1000);last=now;if(playing){acc+=dt;let n=0;while(acc>=1/60&&n<6){update(1/60);acc-=1/60;n++;}if(n===6)acc=0;}render();requestAnimationFrame(loop);}

/* ---------- Start ---------- */
let playing0=false;
$('go').addEventListener('click',()=>{audioInit();$('startScreen').hidden=true;playing=true;last=performance.now();setTimeout(()=>toast(t('tip'),'#ffd23f'),1500);save();});
rebuildPlayer();refreshPet();if(S.house>=0)buildHouse(HOUSES[S.house]);paintHome();renderStats();resize();
window.__ms={get S(){return S},get player(){return player},get cars(){return cars},get people(){return people},HOUSES,BUILDINGS,
  use,nearest,spawnCar,enterCar,exitCar,enterBuilding,leaveBuilding,openPhone,closePhone,get phoneOpen(){return phoneOpen},
  tick:sec=>{for(let i=0;i<sec*60;i++)update(1/60);},keys,get myCar(){return myCar},get playing(){return playing}};
requestAnimationFrame(loop);
})();
</script>
