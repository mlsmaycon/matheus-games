<style>
/* Star Unicorn / Sternen-Einhorn – 2D canvas game: fly in space, catch stars and coins, grow the rainbow, dress up the unicorn in the shop. */
html, body { background: #0b0620; color: #f4ecff; }
  body { font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 14px 28px; }
  .app { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-family: "Arial Rounded MT Bold", "SF Pro Rounded", ui-rounded, "Trebuchet MS", system-ui, sans-serif; font-size: clamp(28px, 6vw, 44px); line-height: 1; margin: 0; color: #ffd93d; text-shadow: 3px 3px 0 #c56cf0; }
  h1 small { display: block; font-size: 14px; color: #d8c8ff; text-shadow: none; margin-top: 8px; }
  .help { margin: 0; color: #d8c8ff; font-size: 14px; line-height: 1.55; max-width: 75ch; }
  .help b { color: #fff; }
  #star-unicorn {
    width: 100%; max-width: 1000px; aspect-ratio: 16 / 10;
    position: relative;
  }
  #star-unicorn canvas {
    width: 100%; height: 100%; display: block;
    border-radius: 18px; touch-action: none; outline: none;
    box-shadow: 0 10px 40px rgba(150, 80, 255, 0.35);
    -webkit-user-select: none; user-select: none;
  }
  #star-unicorn { container-type: inline-size; font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; }
  .su-shop {
    position: absolute; top: 4%; right: 2.5%; width: 54%; height: 92%; box-sizing: border-box;
    background: rgba(255, 255, 255, 0.95); border-radius: 2.2cqw; padding: 1.6cqw;
    display: flex; flex-direction: column; gap: 1.1cqw; font-size: 1.7cqw; color: #3b1d6e;
    box-shadow: 0 1cqw 4cqw rgba(60, 10, 120, 0.45);
  }
  .su-shop[hidden] { display: none; }
  .su-shop button { font: inherit; cursor: pointer; }
  .su-head { display: flex; align-items: center; gap: 1cqw; }
  .su-title { font-weight: bold; font-size: 2.8cqw; flex: 1; }
  .su-coins { background: #fff3c4; border-radius: 999px; padding: 0.4cqw 1.4cqw; font-weight: bold; }
  .su-close { border: 0; width: 3.6cqw; height: 3.6cqw; border-radius: 50%; background: #efe6ff; color: #5b2fa0; font-weight: bold; }
  .su-tabs { display: flex; flex-wrap: wrap; gap: 0.6cqw; }
  .su-tabs button { font-size: 1.2cqw !important; flex: 1 0 auto; padding-inline: 0.6cqw !important; border: 0; border-radius: 1cqw; padding: 0.8cqw 0; font-weight: bold; background: #efe6ff; color: #5b2fa0; }
  .su-tabs button.on { background: #8f5cff; color: #fff; }
  .su-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1cqw; align-content: start; padding: 0.3cqw; }
  .su-card {
    border: 0.3cqw solid transparent; background: #f7f2ff; border-radius: 1.4cqw; padding: 1cqw 0.5cqw;
    color: inherit; display: flex; flex-direction: column; align-items: center; gap: 0.4cqw;
  }
  .su-card.sel { border-color: #8f5cff; background: #fff; }
  .su-icon-unused { width: 5cqw; height: 5cqw; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3.2cqw; box-sizing: border-box; }
  .su-name { font-weight: bold; font-size: 1.5cqw; }
  .su-price { font-size: 1.4cqw; }
  .su-price.owned { color: #2f9e5b; font-weight: bold; }
  .su-bar { display: flex; align-items: center; gap: 1cqw; border-top: 0.2cqw solid #efe6ff; padding-top: 1cqw; }
  .su-sel { flex: 1; font-weight: bold; }
  .su-act { border: 0; border-radius: 999px; padding: 1cqw 2.4cqw; font-weight: bold; color: #fff; background: linear-gradient(90deg, #ff4d9d, #8f5cff); }
  .su-c {
    display: inline-block; width: 1.1em; height: 1.1em; border-radius: 50%; vertical-align: -0.2em;
    background: radial-gradient(circle at 35% 35%, #fff3b0 0 15%, #ffd23f 16% 62%, #d99400 64%);
    position: relative;
  }
  .su-c::after { content: '★'; position: absolute; inset: 0; font-size: 0.62em; line-height: 1.8em; text-align: center; color: #fff6c8; }
  .su-prev { width: 100%; aspect-ratio: 18 / 13; border-radius: 1cqw; background: linear-gradient(#d8efff, #fbe9ff); }
  .su-act:disabled { background: #cfc6e0; cursor: default; }
</style>

      coins = Math.max(0, d.coins | 0);
      (d.owned || []).forEach(k => owned.add(k));
      for (const c in eq) if (d.eq && d.eq[c] && owned.has(c + ':' + d.eq[c]) && SHOP[c].some(i => i.id === d.eq[c])) eq[c] = d.eq[c];

      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      else if (actx.state === 'suspended') actx.resume();
    } catch (e) { /* audio not available */ }
  }
  function tone(freq, dur, type = 'sine', vol = 0.12, delay = 0, slideTo = 0) {
    if (!actx || muted) return;
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
  const sfxCatch = n => { const f = PENTA[n % PENTA.length]; tone(f, 0.25, 'triangle', 0.12); tone(f * 2, 0.2, 'sine', 0.05, 0.03); };
  const sfxBonus = () => [0, 2, 4, 6].forEach((k, i) => tone(PENTA[k], 0.2, 'triangle', 0.1, i * 0.06));
  const sfxHit = () => { tone(220, 0.35, 'sawtooth', 0.07, 0, 70); tone(110, 0.3, 'square', 0.04, 0.02, 60); };
  const sfxRainbow = () => [523, 587, 659, 698, 784, 880, 988, 1047].forEach((f, i) => tone(f, 0.35, 'triangle', 0.09, 0.4 + i * 0.22));
  const sfxWin = () => [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => { tone(f, 0.4, 'triangle', 0.1, i * 0.14); tone(f / 2, 0.4, 'sine', 0.05, i * 0.14); });
  const sfxFly = () => tone(300, 0.6, 'sine', 0.08, 0, 900);
  const sfxCoin = () => { tone(988, 0.08, 'square', 0.05); tone(1319, 0.22, 'square', 0.05, 0.07); };
  const sfxBuy = () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.18, 'triangle', 0.1, i * 0.07));
  const sfxClick = () => tone(660, 0.06, 'triangle', 0.06);

  // ---------- game flow ----------
  function startLevel() {
    state = 'space'; caught = 0; items = [];
    spawnT = 0.4; meteorT = 2.5; coinT = 1.2; levelIntro = 2.4;
    target.x = 200; target.y = 300;
  }
  function action() {
    ensureAudio();
    if (state === 'title') { level = 0; totalStars = 0; particles = []; startLevel(); sfxFly(); }
    else if (state === 'ground' && groundT > 2.2 && level < BANDS) { state = 'takeoff'; transT = 0; sfxFly(); }
    else if (state === 'win' && winT > 1.5) { state = 'title'; level = 0; particles = []; items = []; }
  }

  // ---------- shop ----------
  const root = document.getElementById('star-unicorn');
  const shopEl = document.getElementById('su-shop');
  const shopCoinsEl = document.getElementById('su-coins');
  const shopTabsEl = document.getElementById('su-tabs');
  const shopGridEl = document.getElementById('su-grid');
  const shopSelEl = document.getElementById('su-sel');
  const shopActEl = document.getElementById('su-act');
  const SHOP_BTN = { x: 20, y: H - 72, w: 150, h: 52 };
  function shopButtonVisible() {
    return state === 'title' || (state === 'ground' && groundT > 2.2 && level < BANDS) || (state === 'win' && winT > 1.5);
  }
  function openShop() {
    ensureAudio(); sfxClick();
    shopFrom = state; state = 'shop';
    shopSel = { cat: shopTab, id: eq[shopTab] };
    shopEl.hidden = false;
    renderShop();
  }
  function closeShop() {
    if (state !== 'shop') return;
    state = shopFrom; shopEl.hidden = true; shopSel = null;
    save(); sfxClick();
    canvas.focus({ preventScroll: true });
  }
  function cardPreview(cat, id) {
    const c = document.createElement('canvas');
    c.width = 180; c.height = 130; c.className = 'su-prev';
    const mainCtx = ctx;
    ctx = c.getContext('2d');
    const f = FOCUS[cat] || { x: -8, y: -20, s: 0.8 };
    ctx.translate(90, 68); ctx.scale(f.s, f.s); ctx.translate(-f.x, -f.y);
    drawUnicorn(0, 0, cat === 'wing', 0, 1, 1, getLook({ cat, id }));
    ctx = mainCtx;
    return c;
  }
  function renderShop() {
    shopCoinsEl.innerHTML = COIN + ' ' + coins;
    shopTabsEl.innerHTML = '';
    for (const [cat, label] of TABS) {
      const b = document.createElement('button');
      b.textContent = label; if (cat === shopTab) b.className = 'on';
      b.onclick = () => { shopTab = cat; shopSel = { cat, id: eq[cat] }; sfxClick(); shopGridEl.scrollTop = 0; renderShop(); };
      shopTabsEl.appendChild(b);
    }
    const scroll = shopGridEl.scrollTop;
    shopGridEl.innerHTML = '';
    for (const item of SHOP[shopTab]) {
      const key = shopTab + ':' + item.id;
      const card = document.createElement('button');
      card.className = 'su-card' + (shopSel && shopSel.id === item.id ? ' sel' : '');
      const icon = cardPreview(shopTab, item.id);
      const name = document.createElement('div'); name.className = 'su-name'; name.textContent = nm(item);
      const price = document.createElement('div');
      const has = owned.has(key);
      price.className = 'su-price' + (has ? ' owned' : '');
      price.innerHTML = eq[shopTab] === item.id ? t('wearing') : has ? t('owned') : COIN + ' ' + item.price;
      card.append(icon, name, price);
      card.onclick = () => { shopSel = { cat: shopTab, id: item.id }; sfxClick(); renderShop(); };
      shopGridEl.appendChild(card);
    }
    shopGridEl.scrollTop = scroll;
    const it = findItem(shopSel.cat, shopSel.id);
    const has = owned.has(shopSel.cat + ':' + it.id);
    shopSelEl.textContent = nm(it);
    shopActEl.disabled = false;
    if (eq[shopSel.cat] === it.id) { shopActEl.textContent = t('wearing'); shopActEl.disabled = true; }
    else if (has) shopActEl.textContent = it.id === 'none' ? t('takeOff') : t('wear');
    else if (coins >= it.price) shopActEl.innerHTML = t('buy', { c: COIN, n: it.price });
    else { shopActEl.innerHTML = t('need', { c: COIN, n: it.price - coins }); shopActEl.disabled = true; }
  }
  shopActEl.onclick = () => {
    const { cat, id } = shopSel, it = findItem(cat, id), key = cat + ':' + id;
    if (!owned.has(key)) {
      if (coins < it.price) return;
      coins -= it.price; owned.add(key); sfxBuy();
      burst(W * 0.24, 300, RAINBOW, 30);
    } else sfxClick();
    eq[cat] = id; save(); renderShop();
  };
  document.getElementById('su-close').onclick = closeShop;

  // ---------- particles ----------
  function addP(p) { if (particles.length < 700) particles.push(p); }
  function burst(x, y, colors, n = 16) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = rand(60, 260);
      addP({ type: i % 3 ? 'dot' : 'star', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 120, life: rand(0.5, 1), max: 1, c: colors[i % colors.length], size: rand(2, 5) });
    }
  }
  function floatText(x, y, txt, c) { addP({ type: 'text', x, y, vx: 0, vy: -60, g: 0, life: 1, max: 1, c, txt }); }

  // ---------- update ----------
  function update(dt) {
    time += dt;
    const spd = state === 'space' ? 1 : state === 'title' ? 0.5 : 0.2;
    for (const s of bgStars) { s.x -= s.sp * spd * dt; if (s.x < 0) s.x += W; }
    for (const c of clouds) { c.x -= c.sp * dt; if (c.x < -160) c.x = W + 160; }
    if (shake > 0) shake -= dt;
    if (uni.inv > 0) uni.inv -= dt;
    const prevY = uni.y;

    if (state === 'title') {
      uni.x = W / 2 - 20 + Math.sin(time * 0.8) * 30;
      uni.y = 330 + Math.sin(time * 1.6) * 14;
    } else if (state === 'space') {
      moveUnicorn(dt); spawn(dt); collide();
      levelIntro -= dt;
    } else if (state === 'landing') {
      transT += dt;
      const p = ease(Math.min(1, transT / LAND));
      uni.x = lerp(landFrom.x, GX, p); uni.y = lerp(landFrom.y, GY(), p);
      if (transT >= LAND) {
        state = 'ground'; level++; groundT = 0; items = []; sfxRainbow();
        lastReward = 8 + level * 2; coins += lastReward; save();
      }
    } else if (state === 'ground') {
      groundT += dt;
      uni.x = GX; uni.y = GY() - Math.abs(Math.sin(time * 4)) * 8;
      const gp = rainbowGrow();
      if (gp > 0 && gp < 1) {
        const a = Math.PI + Math.PI * gp, r = 330 - (level - 1) * 20 - 10;
        addP({ type: 'star', x: W * 0.6 + Math.cos(a) * r, y: GROUND + 30 + Math.sin(a) * r, vx: rand(-60, 60), vy: rand(-80, 20), g: 60, life: 0.9, max: 0.9, c: RAINBOW[level - 1], size: rand(3, 6) });
      }
      if (level >= BANDS && groundT > 3.2) { state = 'win'; winT = 0; sfxWin(); }
    } else if (state === 'takeoff') {
      transT += dt;
      const p = ease(Math.min(1, transT / TAKE));
      uni.x = lerp(GX, 200, p); uni.y = lerp(GY(), 300, p);
      if (transT >= TAKE) startLevel();
    } else if (state === 'win') {
      winT += dt;
      uni.x = GX; uni.y = GY() - Math.abs(Math.sin(time * 5)) * 14;
      if (Math.random() < 0.6) addP({ type: Math.random() < 0.5 ? 'star' : 'dot', x: rand(0, W), y: -10, vx: rand(-30, 30), vy: rand(60, 150), g: 10, life: 5, max: 5, c: RAINBOW[(Math.random() * 7) | 0], size: rand(3, 7) });
    }
    uni.vy = (uni.y - prevY) / Math.max(dt, 0.001);

    // sparkle trail while flying
    if (isFlying() && state !== 'shop' && Math.random() < 0.8) {
      const mc = getLook().mane;
      addP({ type: 'dot', x: uni.x - 70, y: uni.y + rand(-12, 10), vx: rand(-160, -80), vy: rand(-15, 15), g: 0, life: 0.6, max: 0.6, c: mc[(Math.random() * 7) | 0], size: rand(1.5, 3.5) });
    }

    for (const it of items) {
      it.x += it.vx * dt; it.y += it.vy * dt; it.rot += it.vr * dt;
      if (it.type !== 'meteor') it.y += Math.sin(time * 2 + it.ph) * 22 * dt;
    }
    items = items.filter(it => it.x > -120 && !it.dead);

    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0 && p.y < H + 40);
  }

  function isFlying() {
    return state === 'space' || state === 'title' || state === 'takeoff' || (state === 'landing' && transT < LAND * 0.85);
  }
  function rainbowGrow() { return state === 'ground' ? clamp((groundT - 0.3) / 2, 0, 1) : 1; }

  function moveUnicorn(dt) {
    const kx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    const ky = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (kx || ky) {
      pointerActive = false;
      const len = Math.hypot(kx, ky);
      target.x += kx / len * 460 * dt; target.y += ky / len * 460 * dt;
    } else if (pointerActive) { target.x = pointer.x; target.y = pointer.y; }
    target.x = clamp(target.x, 80, W - 90); target.y = clamp(target.y, 100, H - 55);
    const k = 1 - Math.exp(-dt * 8);
    uni.x += (target.x - uni.x) * k; uni.y += (target.y - uni.y) * k;
  }

  function spawn(dt) {
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnT = Math.max(0.42, 0.8 - level * 0.05) * rand(0.7, 1.3);
      const bonus = Math.random() < 0.07;
      items.push({ type: bonus ? 'bonus' : 'star', x: W + 40, y: rand(90, H - 60), vx: -(150 + level * 18 + Math.random() * 70), vy: 0, r: bonus ? 22 : 17, rot: 0, vr: rand(-2, 2), ph: Math.random() * 6 });
    }
    meteorT -= dt;
    if (meteorT <= 0) {
      meteorT = Math.max(0.9, 3.2 - level * 0.35) * rand(0.7, 1.3);
      items.push({ type: 'meteor', x: W + 70, y: rand(90, H - 50), vx: -(210 + level * 30 + Math.random() * 90), vy: rand(-40, 40), r: rand(18, 28), rot: 0, vr: rand(-1.5, 1.5), ph: 0 });
    }
    coinT -= dt;
    if (coinT <= 0) {
      coinT = rand(1.0, 1.8);
      const vx = -(170 + level * 15 + Math.random() * 40);
      const y0 = rand(120, H - 100);
      const n = Math.random() < 0.35 ? 5 : 1;   // sometimes a wavy line of coins
      for (let i = 0; i < n; i++) {
        items.push({ type: 'coin', x: W + 30 + i * 42, y: y0 + Math.sin(i * 0.9) * 30, vx, vy: 0, r: 13, rot: 0, vr: 0, ph: i * 0.6 });
      }
    }
  }

  function collide() {
    const hx = uni.x + 12, hy = uni.y - 12;
    for (const it of items) {
      if (it.dead) continue;
      const d = Math.hypot(it.x - hx, it.y - hy);
      if (it.type === 'coin' && d < it.r + 38) {
        it.dead = true; coins++; save();
        burst(it.x, it.y, ['#ffd23f', '#fff3b0', '#e0a100'], 8);
        floatText(it.x, it.y - 20, '+1', '#ffd23f');
        sfxCoin();
      } else if (it.type !== 'meteor' && it.type !== 'coin' && d < it.r + 38) {
        it.dead = true;
        const v = it.type === 'bonus' ? 3 : 1;
        caught += v; totalStars += v;
        burst(it.x, it.y, it.type === 'bonus' ? RAINBOW : ['#fff7c2', '#ffd93d', '#ffffff']);
        floatText(it.x, it.y - 20, '+' + v, it.type === 'bonus' ? '#ffb3f0' : '#ffe066');
        v > 1 ? sfxBonus() : sfxCatch(caught);
      } else if (it.type === 'meteor' && d < it.r + 26 && uni.inv <= 0) {
        uni.inv = 1.6; shake = 0.35;
        const lost = Math.min(2, caught);
        caught -= lost;
        burst(uni.x, uni.y, ['#ffd93d', '#aaaaaa'], 10);
        floatText(uni.x, uni.y - 70, lost ? '-' + lost + ' ★' : t('ouch'), '#ff8fa3');
        sfxHit();
      }
    }
    if (caught >= NEED(level)) {
      caught = NEED(level);
      state = 'landing'; transT = 0;
      landFrom.x = uni.x; landFrom.y = uni.y;
    }
  }

  // ---------- drawing helpers ----------
  function starPath(r1, r2, n = 5) {
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const r = i % 2 ? r2 : r1, a = -Math.PI / 2 + i * Math.PI / n;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
  }
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function text(str, x, y, size, fill, stroke, align = 'center') {
    ctx.font = `bold ${size}px ${FONT}`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    if (stroke) { ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
    ctx.fillStyle = fill; ctx.fillText(str, x, y);
  }
  function glowBlob(x, y, r, c) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  // ---------- scenes ----------
  function drawSpace() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a0420'); g.addColorStop(0.55, '#21104a'); g.addColorStop(1, '#3a1659');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    glowBlob(W * 0.75, H * 0.3, 280, 'rgba(255,90,200,0.17)');
    glowBlob(W * 0.2, H * 0.75, 320, 'rgba(80,140,255,0.17)');
    glowBlob(W * 0.5, H * 0.08, 220, 'rgba(150,90,255,0.15)');
    for (const s of bgStars) {
      ctx.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(time * 1.5 + s.tw));
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // ringed planet
    const px = W * 0.84 + Math.sin(time * 0.15) * 12, py = H * 0.8;
    ctx.save(); ctx.translate(px, py); ctx.rotate(-0.35);
    ctx.strokeStyle = 'rgba(255,220,250,0.55)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(0, 0, 72, 16, 0, Math.PI, Math.PI * 2); ctx.stroke();
    const pg = ctx.createRadialGradient(-14, -16, 6, 0, 0, 44);
    pg.addColorStop(0, '#ffc6e8'); pg.addColorStop(1, '#8c4bff');
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(0, 0, 42, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, 72, 16, 0, 0, Math.PI); ctx.stroke();
    ctx.restore();
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#6ec6ff'); g.addColorStop(0.5, '#b7e3ff'); g.addColorStop(1, '#ffe0f2');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    glowBlob(W * 0.88, H * 0.16, 120, 'rgba(255,250,200,0.8)');
    ctx.fillStyle = '#fff6a8'; ctx.beginPath(); ctx.arc(W * 0.88, H * 0.16, 42, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    for (const c of clouds) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
      ctx.beginPath();
      ctx.arc(-40, 8, 26, 0, 7); ctx.arc(-10, -8, 34, 0, 7); ctx.arc(28, 2, 28, 0, 7); ctx.arc(54, 12, 18, 0, 7);
      ctx.fill(); ctx.restore();
    }
  }

  function drawRainbow(full, growIdx, growP, off, alpha) {
    const cx = W * 0.6, cy = GROUND + 30 + off, R = 330, bw = 20;
    ctx.save(); ctx.globalAlpha = alpha; ctx.lineCap = 'butt';
    // ghost outline of bands still to earn
    ctx.setLineDash([6, 10]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    for (let i = 0; i < BANDS; i++) {
      if (i < full || i === growIdx) continue;
      ctx.beginPath(); ctx.arc(cx, cy, R - i * bw - bw / 2, Math.PI, Math.PI * 2); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.shadowColor = 'rgba(255,255,255,0.7)'; ctx.shadowBlur = 16;
    for (let i = 0; i < BANDS; i++) {
      const end = i < full ? 1 : i === growIdx ? growP : 0;
      if (end <= 0) continue;
      ctx.beginPath(); ctx.arc(cx, cy, R - i * bw - bw / 2, Math.PI, Math.PI + Math.PI * end);
      ctx.strokeStyle = RAINBOW[i]; ctx.lineWidth = bw + 1; ctx.stroke();
    }
    ctx.restore();
  }

  function drawGround(off) {
    ctx.save(); ctx.translate(0, off);
    ctx.fillStyle = '#9be7b0';
    ctx.beginPath(); ctx.moveTo(0, 450);
    ctx.bezierCurveTo(W * 0.25, 380, W * 0.45, 470, W * 0.7, 425);
    ctx.bezierCurveTo(W * 0.85, 398, W * 0.95, 432, W, 420);
    ctx.lineTo(W, H + 10); ctx.lineTo(0, H + 10); ctx.closePath(); ctx.fill();
    const g = ctx.createLinearGradient(0, GROUND - 10, 0, H);
    g.addColorStop(0, '#72d68d'); g.addColorStop(1, '#3d9e5c');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, groundY(0));
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, groundY(x));
    ctx.lineTo(W, H + 10); ctx.lineTo(0, H + 10); ctx.closePath(); ctx.fill();
    for (const f of flowers) {
      const fx = f.x, fy = groundY(fx) + f.dy;
      ctx.strokeStyle = '#2f8a4c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - 12 * f.s); ctx.stroke();
      ctx.fillStyle = f.c;
      for (let k = 0; k < 5; k++) {
        const a = k * 1.2566 + time * 0.5;
        ctx.beginPath(); ctx.arc(fx + Math.cos(a) * 4 * f.s, fy - 12 * f.s + Math.sin(a) * 4 * f.s, 3.2 * f.s, 0, 7); ctx.fill();
      }
      ctx.fillStyle = '#fff3a0'; ctx.beginPath(); ctx.arc(fx, fy - 12 * f.s, 2.4 * f.s, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  // ----- outfit pieces (all in the unicorn's own coordinates; it faces right) -----
  function scallopHem(x0, x1, y, n, depth) {
    // continues the current path along a scalloped bottom edge from x1 back to x0
    const step = (x1 - x0) / n;
    for (let i = n; i > 0; i--) {
      const xa = x0 + i * step, xb = xa - step;
      ctx.quadraticCurveTo((xa + xb) / 2, y + depth, xb, y);
    }
  }
  // shared puffy skirt that sits on the rump (used by the tutu and all dresses)
  function drawPuffSkirt(cols, band, deco, flying) {
    const b = Math.sin(time * 8) * (flying ? 1.5 : 0.6);
    // waistband wrapping around the hips
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, 0, 44, 26, 0, 0, 7); ctx.clip();
    ctx.fillStyle = band; ctx.beginPath(); ctx.ellipse(-2, 0, 6, 30, -0.3, 0, 7); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.translate(10, 0);
    ctx.transform(1, 0, 0.3, 1, 9, 0);   // slant: top stays, bottom of the skirt sweeps toward the legs
    const layers = [[cols[0], 34, 9], [cols[1], 29, 7.5], [cols[2], 24, 6]];
    layers.forEach(([col, rad, r], L) => {

    if (look.acc === 'helmet') {
      const hg2 = ctx.createRadialGradient(42, -62, 4, 52, -50, 44);
      hg2.addColorStop(0, 'rgba(255,255,255,0.35)'); hg2.addColorStop(1, 'rgba(160,210,255,0.18)');
      ctx.fillStyle = hg2; ctx.beginPath(); ctx.arc(52, -50, 44, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(52, -50, 36, -2.6, -1.9); ctx.stroke();
    }
    ctx.restore();
  }

  function drawCoin(r, sx) {
    ctx.save(); ctx.scale(Math.max(0.15, sx), 1);
    ctx.fillStyle = '#d99400'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff3b0'; starPath(r * 0.45, r * 0.2); ctx.fill();
    ctx.restore();
  }

  function drawItems(alpha) {
    if (alpha <= 0) return;
    for (const it of items) {
      ctx.save(); ctx.globalAlpha = alpha; ctx.translate(it.x, it.y);
      if (it.type === 'coin') {
        ctx.shadowBlur = 10; ctx.shadowColor = '#ffd23f';
        drawCoin(it.r, Math.cos(time * 4 + it.ph));
      } else if (it.type === 'meteor') {
        ctx.save(); ctx.rotate(Math.atan2(it.vy, it.vx));
        const tg = ctx.createLinearGradient(0, 0, -it.r * 5, 0);
        tg.addColorStop(0, 'rgba(255,170,70,0.85)'); tg.addColorStop(1, 'rgba(255,80,60,0)');
        ctx.fillStyle = tg;
        ctx.beginPath(); ctx.moveTo(0, -it.r * 0.85); ctx.lineTo(-it.r * 5, 0); ctx.lineTo(0, it.r * 0.85); ctx.closePath(); ctx.fill();
        ctx.restore();
        ctx.rotate(it.rot);
        const mg = ctx.createRadialGradient(-it.r * 0.3, -it.r * 0.3, 2, 0, 0, it.r);
        mg.addColorStop(0, '#a796b8'); mg.addColorStop(1, '#5a4a6e');
        ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(0, 0, it.r, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(40,30,55,0.45)';
        ctx.beginPath(); ctx.arc(it.r * 0.3, -it.r * 0.2, it.r * 0.22, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(-it.r * 0.35, it.r * 0.35, it.r * 0.16, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(-it.r * 0.1, -it.r * 0.5, it.r * 0.12, 0, 7); ctx.fill();
      } else {
        const tw = 1 + Math.sin(time * 6 + it.ph) * 0.08;
        ctx.rotate(it.rot); ctx.scale(tw, tw);
        ctx.shadowBlur = 18;
        if (it.type === 'bonus') {
          const hue = (time * 220) % 360;
          ctx.shadowColor = `hsl(${hue},100%,75%)`; ctx.fillStyle = `hsl(${hue},100%,70%)`;
        } else {
          ctx.shadowColor = '#ffe066';
          const sg = ctx.createRadialGradient(0, 0, 2, 0, 0, it.r);
          sg.addColorStop(0, '#fffbe0'); sg.addColorStop(1, '#ffc93c');
          ctx.fillStyle = sg;
        }
        starPath(it.r, it.r * 0.46); ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.save(); ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      if (p.type === 'text') { text(p.txt, p.x, p.y, 26, p.c, 'rgba(40,10,70,0.8)'); }
      else {
        ctx.fillStyle = p.c; ctx.translate(p.x, p.y);
        if (p.type === 'star') { ctx.rotate(p.x * 0.05); starPath(p.size * 1.5, p.size * 0.65); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(0, 0, p.size, 0, 7); ctx.fill(); }
      }
      ctx.restore();
    }
  }

  function drawMiniRainbow(cx, cy, alpha) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.lineWidth = 3.6;
    for (let i = 0; i < BANDS; i++) {
      ctx.strokeStyle = i < level ? RAINBOW[i] : 'rgba(255,255,255,0.18)';
      ctx.beginPath(); ctx.arc(cx, cy, 32 - i * 4, Math.PI, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawHUD(alpha) {
    if (alpha <= 0) return;
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(255,255,255,0.13)'; rrect(18, 16, 250, 66, 16); ctx.fill();
    ctx.save(); ctx.translate(50, 46); ctx.rotate(time * 0.8);
    ctx.shadowBlur = 12; ctx.shadowColor = '#ffe066'; ctx.fillStyle = '#ffd93d';
    starPath(17, 8); ctx.fill(); ctx.restore();
    text(`${caught} / ${NEED(level)}`, 80, 38, 26, '#ffffff', null, 'left');
    const bw = 170, prog = caught / NEED(level);
    ctx.fillStyle = 'rgba(255,255,255,0.2)'; rrect(80, 58, bw, 10, 5); ctx.fill();
    if (prog > 0) {
      const pg = ctx.createLinearGradient(80, 0, 80 + bw, 0);
      RAINBOW.forEach((c, i) => pg.addColorStop(i / 6, c));
      ctx.fillStyle = pg; rrect(80, 58, Math.max(10, bw * prog), 10, 5); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.13)'; rrect(18, 90, 140, 44, 14); ctx.fill();
    ctx.save(); ctx.translate(44, 112); drawCoin(13, 1); ctx.restore();
    text(String(coins), 66, 113, 24, '#ffe9a0', null, 'left');
    drawMiniRainbow(W - 120, 66, 1);
    ctx.restore();
  }

  function drawShopButton() {
    const b = SHOP_BTN, bob = Math.sin(time * 3) * 2;
    ctx.save(); ctx.translate(0, bob);
    const g = ctx.createLinearGradient(b.x, 0, b.x + b.w, 0);
    g.addColorStop(0, '#ff4d9d'); g.addColorStop(1, '#8f5cff');
    ctx.shadowBlur = 14; ctx.shadowColor = 'rgba(255,120,220,0.7)';
    ctx.fillStyle = g; rrect(b.x, b.y, b.w, b.h, 26); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; rrect(b.x, b.y, b.w, b.h, 26); ctx.stroke();
    text(t('shop'), b.x + b.w / 2, b.y + b.h / 2 + 1, 26, '#ffffff', null);
    ctx.restore();
    ctx.fillStyle = 'rgba(40,10,80,0.45)'; rrect(b.x + b.w + 12, b.y + 6, 110, 40, 20); ctx.fill();
    ctx.save(); ctx.translate(b.x + b.w + 34, b.y + 26); drawCoin(12, 1); ctx.restore();
    text(String(coins), b.x + b.w + 54, b.y + 27, 22, '#ffe9a0', null, 'left');
  }

  function drawMute() {
    ctx.save(); ctx.globalAlpha = 0.85;
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.arc(W - 38, 38, 20, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(W - 48, 33); ctx.lineTo(W - 42, 33); ctx.lineTo(W - 35, 26); ctx.lineTo(W - 35, 50); ctx.lineTo(W - 42, 43); ctx.lineTo(W - 48, 43); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath();
    if (muted) { ctx.moveTo(W - 31, 32); ctx.lineTo(W - 23, 44); ctx.moveTo(W - 23, 32); ctx.lineTo(W - 31, 44); }
    else { ctx.arc(W - 34, 38, 6, -0.9, 0.9); ctx.moveTo(W - 28 + 3.5, 30); ctx.arc(W - 34, 38, 11, -0.85, 0.85); }
    ctx.stroke(); ctx.restore();
  }

  function pulse() { return 0.6 + 0.4 * Math.sin(time * 4); }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate(rand(-6, 6) * shake * 2, rand(-6, 6) * shake * 2);

    const scene = state === 'shop' ? shopFrom : state;
    let skyA = 0, off = 260;
    if (scene === 'ground' || scene === 'win') { skyA = 1; off = 0; }
    if (state === 'landing') { const p = ease(Math.min(1, transT / LAND)); skyA = p; off = (1 - p) * 260; }
    else if (state === 'ground' || state === 'win') { skyA = 1; off = 0; }
    else if (state === 'takeoff') { const p = ease(Math.min(1, transT / TAKE)); skyA = 1 - p; off = p * 260; }

    drawSpace();
    if (skyA > 0) { ctx.globalAlpha = skyA; drawSky(); ctx.globalAlpha = 1; }
    if (skyA > 0) {
      const growing = state === 'ground';
      drawRainbow(growing ? level - 1 : level, growing ? level - 1 : -1, rainbowGrow(), off, skyA);
      drawGround(off);
    }
    drawItems(1 - skyA);
    drawParticles();

    const tilt = isFlying() ? clamp(uni.vy * 0.0012, -0.35, 0.35) : 0;
    const blink = uni.inv > 0 && Math.floor(time * 12) % 2 ? 0.35 : 1;
    if (state === 'shop') {
      const fl = shopFrom === 'title';
      drawUnicorn(W * 0.25 - 10, (fl ? 330 : 400) + (fl ? Math.sin(time * 1.6) * 10 : 0), fl, 0, 1, 2, getLook(shopSel));
      text(t('tryOn'), W * 0.24, fl ? 470 : 140, 26, '#ffffff', '#6c2bb3');
    } else drawUnicorn(uni.x, uni.y, isFlying(), tilt, blink);
    if (shopButtonVisible()) drawShopButton();

    if (state === 'title') {
      const tg = ctx.createLinearGradient(W / 2 - 230, 0, W / 2 + 230, 0);
      RAINBOW.forEach((c, i) => tg.addColorStop(i / 6, c));
      text(t('title'), W / 2, 110, LANG === 'de' ? 64 : 72, tg, '#2a0f4f');
      text(t('tagline'), W / 2, 172, 22, '#ffffff', 'rgba(20,5,40,0.8)');
      text(t('controls'), W / 2, 452, 18, '#e8dcff', 'rgba(20,5,40,0.8)');
      ctx.globalAlpha = pulse();
      text(t('start'), W / 2, 498, 28, '#ffe066', '#2a0f4f');
      ctx.globalAlpha = 1;
    }
    if (state === 'space' || state === 'landing') {
      drawHUD(state === 'space' ? 1 : 1 - skyA);
      if (state === 'space' && levelIntro > 0) {
        ctx.globalAlpha = clamp(levelIntro, 0, 1);
        text(t('trip', { n: level + 1, m: BANDS }), W / 2, H / 2 - 40, 40, '#ffffff', '#2a0f4f');
        text(t('catchN', { n: NEED(level) }), W / 2, H / 2 + 8, 30, '#ffe066', '#2a0f4f');
        ctx.globalAlpha = 1;
      }
      if (state === 'landing' && transT < 1.4) {
        ctx.globalAlpha = clamp(1.4 - transT, 0, 1);
        text(t('home'), W / 2, H / 2 - 120, 34, '#ffffff', '#2a0f4f');
        ctx.globalAlpha = 1;
      }
    }
    if (state === 'ground' && groundT > 0.3) {
      ctx.globalAlpha = clamp((groundT - 0.3) * 2, 0, 1);
      text(t('grew', { n: level, m: BANDS }), W / 2, 70, LANG === 'de' ? 34 : 40, '#ffffff', '#6c2bb3');
      text(t('bonus', { n: lastReward }), W / 2, 168, 24, '#ffd23f', '#6c2bb3');
      ctx.globalAlpha = 1;
      if (groundT > 2.2 && level < BANDS) {
        ctx.globalAlpha = pulse();
        text(t('again'), W / 2, 122, 24, '#6c2bb3', '#ffffff');
        ctx.globalAlpha = 1;
      }
    }
    if (state === 'win') {
      ctx.globalAlpha = clamp(winT * 2, 0, 1);
      text(t('done'), W / 2, 70, 42, '#ffffff', '#6c2bb3');
      text(t('total', { n: totalStars }), W / 2, 120, 26, '#6c2bb3', '#ffffff');
      if (winT > 1.5) { ctx.globalAlpha = pulse(); text(t('replay'), W / 2, 165, 24, '#ff4d6d', '#ffffff'); }
      ctx.globalAlpha = 1;
    }
    drawMute();
    ctx.restore();
  }

  // ---------- input ----------
  function toGame(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  canvas.addEventListener('pointerdown', e => {
    focused = true; canvas.focus({ preventScroll: true });
    const p = toGame(e);
    if (state === 'shop') return;
    if (Math.hypot(p.x - (W - 38), p.y - 38) < 24) { muted = !muted; ensureAudio(); return; }
    const b = SHOP_BTN;
    if (shopButtonVisible() && p.x > b.x && p.x < b.x + b.w && p.y > b.y - 4 && p.y < b.y + b.h + 4) { openShop(); return; }
    pointer.x = p.x; pointer.y = p.y - (e.pointerType === 'touch' ? 50 : 0);
    pointerActive = true;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
    action();
  });
  canvas.addEventListener('pointermove', e => {
    const p = toGame(e);
    pointer.x = p.x; pointer.y = p.y - (e.pointerType === 'touch' ? 50 : 0);
    pointerActive = true;
  });
  document.addEventListener('pointerdown', e => { focused = root.contains(e.target); });
  canvas.addEventListener('focus', () => { focused = true; });
  const keyMap = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
  window.addEventListener('keydown', e => {
    if (!focused) return;
    if (state === 'shop') { if (e.code === 'Escape') closeShop(); return; }
    if (e.code === 'KeyB' && shopButtonVisible()) { openShop(); return; }
    if (keyMap[e.code]) { keys[keyMap[e.code]] = true; e.preventDefault(); }
    else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) action(); }
    else if (e.code === 'KeyM') { muted = !muted; }
  });
  window.addEventListener('keyup', e => { if (keyMap[e.code]) keys[keyMap[e.code]] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    canvas.style.cursor = state === 'space' ? 'none' : 'pointer';
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
