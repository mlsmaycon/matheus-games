<script>
(()=>{
const $=id=>document.getElementById(id);
const LANG=((window.MW_LANG||document.documentElement.lang||'de')+'').slice(0,2)==='en'?'en':'de';
const TXT={
  de:{
    title:'Hühnerchaos',sub:'Fang die Hühner – aber pass auf den Stapel auf!',statScore:'Punkte',statBest:'Rekord',
    intro:'Die Hühner sind ausgebüxt! Renn über den Hof, fang sie ein und stapel sie auf deinem Kopf. Bring sie in den Stall, bevor die Zeit um ist. Je höher der Stapel, desto mehr Punkte – aber desto mehr wackelt er. Und Vorsicht vor der Gans!',
    go:'Los geht’s',again:'Nochmal',endTitle:'Feierabend!',soundOn:'Ton an · M',soundOff:'Ton aus · M',wobble:'Wackeln',
    help:'<b>Steuerung:</b> WASD / Pfeiltasten oder im Spielfeld ziehen, Mausrad zoomt, <b>M</b> schaltet den Ton um. Lauf in die Hühner, um sie zu fangen, und lauf zur Stalltür, um sie abzugeben. Scharfe Kurven bringen den Stapel ins Wackeln.',
    noload:'3D konnte nicht geladen werden.',coop:'Hühnerstall',drop:'Hier abgeben!',cluck:'Gack!',gold:'Goldhuhn!',
    goldCaught:'Goldhuhn gefangen! Zählt 5 Punkte.',deliver:'{n} Hühner im Stall! +{p}',deliver1:'1 Huhn im Stall! +{p}',bonus:' Stapel-Bonus!',
    topple:'Hoppla! {n} Hühner fliegen davon!',topple1:'Hoppla! Ein Huhn fliegt davon!',gooseAngry:'Die Gans ist sauer!',honk:'HONK!',
    gooseHit:'Die Gans hat dich umgerannt!',mud:'Matsch! Rutschig!',newChickens:'Neue Ausreißer auf dem Hof!',goose2:'Noch eine Gans! Oh nein.',
    late:'Noch 15 Sekunden!',start:'Kikeriki! Fang die Hühner!',
    end:'{s} Punkte · {c} Hühner gefangen · höchster Stapel: {h}',record:' · Neuer Rekord!',
    r0:'Hühner-Lehrling',r1:'Hühner-Hüter',r2:'Hühnerflüsterer',r3:'Hühner-Legende',
    tScore:'Punkte: {n}'
  },
  en:{
    title:'Chicken Chaos',sub:'Catch the chickens – but mind the stack!',statScore:'Points',statBest:'Best',
    intro:'The chickens have escaped! Run across the farmyard, catch them and stack them on your head. Bring them back to the coop before time runs out. The higher the stack, the more points – but the more it wobbles. And watch out for the goose!',
    go:'Let’s go',again:'Play again',endTitle:'Day’s done!',soundOn:'Sound on · M',soundOff:'Sound off · M',wobble:'Wobble',
    help:'<b>Controls:</b> WASD / arrow keys or drag on the playfield, mouse wheel zooms, <b>M</b> toggles sound. Run into chickens to catch them and run to the coop door to drop them off. Sharp turns make the stack wobble.',
    noload:'3D could not be loaded.',coop:'Chicken coop',drop:'Drop off here!',cluck:'Cluck!',gold:'Golden chicken!',
    goldCaught:'Golden chicken caught! Worth 5 points.',deliver:'{n} chickens in the coop! +{p}',deliver1:'1 chicken in the coop! +{p}',bonus:' Stack bonus!',
    topple:'Whoops! {n} chickens fly off!',topple1:'Whoops! A chicken flies off!',gooseAngry:'The goose is angry!',honk:'HONK!',
    gooseHit:'The goose knocked you over!',mud:'Mud! Slippery!',newChickens:'New runaways in the yard!',goose2:'Another goose! Oh no.',
    late:'15 seconds left!',start:'Cock-a-doodle-doo! Catch the chickens!',
    end:'{s} points · {c} chickens caught · highest stack: {h}',record:' · New record!',
    r0:'Chicken Apprentice',r1:'Chicken Keeper',r2:'Chicken Whisperer',r3:'Chicken Legend',
    tScore:'Points: {n}'
  }
};
const t=(k,v)=>{let s=(TXT[LANG][k]??TXT.de[k]??k);if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s;};
document.querySelector('h1').firstChild.textContent=t('title');
document.querySelector('h1 small').textContent=t('sub');
document.querySelectorAll('[data-t]').forEach(el=>{const k=el.getAttribute('data-t');if(el.dataset.html)el.innerHTML=t(k);else el.textContent=t(k);});
if(!window.THREE){$('hScore').textContent=t('noload');return;}

/* ---------- Hof (Meter, x/z) ---------- */
const FX=21.5,FZ=14.5,GAME_T=120;
const COOP={x:0,z:-1.2,w:5.4,d:4};
const DOOR={x:0,z:COOP.z+COOP.d/2+1.1};
const POND={x:14,z:-8,r:3.1};
const HAY=[[-6,-9.5],[-7.7,-8.4],[8.5,8],[-16,9],[17.5,10.5],[16,1.5]].map(([x,z])=>({x,z,r:1}));
const TRACTOR={x:-15,z:-8.5,w:3.6,d:2.3};
const MUD=[[-9.5,5,2.6],[8.5,3,2.2],[3.5,-9.5,2.3],[-17.5,-0.5,2]].map(([x,z,r])=>({x,z,r}));
const rects=[COOP,TRACTOR];
const circles=HAY.concat([POND]);
function collide(e,r){
  for(const b of rects){
    const cx=Math.max(b.x-b.w/2,Math.min(e.x,b.x+b.w/2)),cz=Math.max(b.z-b.d/2,Math.min(e.z,b.z+b.d/2));
    const dx=e.x-cx,dz=e.z-cz,d=Math.hypot(dx,dz);
    if(d<r){if(d<1e-4){e.z=b.z+b.d/2+r;continue;}e.x=cx+dx/d*r;e.z=cz+dz/d*r;}
  }
  for(const c of circles){const dx=e.x-c.x,dz=e.z-c.z,d=Math.hypot(dx,dz),m=r+c.r;if(d<m){if(d<1e-4){e.x+=m;continue;}e.x=c.x+dx/d*m;e.z=c.z+dz/d*m;}}
  e.x=Math.max(-FX+r,Math.min(FX-r,e.x));e.z=Math.max(-FZ+r,Math.min(FZ-r,e.z));
}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
function blockedAt(p,pad){
  if(rects.some(b=>Math.abs(p.x-b.x)<b.w/2+pad&&Math.abs(p.z-b.z)<b.d/2+pad))return true;
  return circles.some(c=>Math.hypot(p.x-c.x,p.z-c.z)<c.r+pad);
}
function freePoint(awayFrom,minD){
  for(let i=0;i<60;i++){
    const p={x:(Math.random()*2-1)*(FX-1.5),z:(Math.random()*2-1)*(FZ-1.5)};
    if(blockedAt(p,0.9))continue;
    if(awayFrom&&dist(p,awayFrom)<(minD||0))continue;
    return p;
  }
  return {x:10,z:10};
}

/* ---------- Three.js ---------- */
const stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color('#8fd3ff');
scene.fog=new THREE.Fog('#8fd3ff',40,80);
const camera=new THREE.PerspectiveCamera(48,1.6,0.1,200);
scene.add(new THREE.HemisphereLight(0xf2f8ff,0x5a8a3c,0.75));
const sun=new THREE.DirectionalLight(0xfff2d6,0.85);
sun.position.set(-12,28,16);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-26,right:26,top:20,bottom:-20,near:1,far:80});sun.shadow.bias=-0.0006;
scene.add(sun);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);

const G={sph:new THREE.SphereGeometry(1,18,12),half:new THREE.SphereGeometry(1,16,8,0,Math.PI*2,0,Math.PI/2),cyl:new THREE.CylinderGeometry(1,1,1,16),
  cone:new THREE.ConeGeometry(1,1,12),box:new THREE.BoxGeometry(1,1,1),ico:new THREE.IcosahedronGeometry(1,0),circle:new THREE.CircleGeometry(1,40),
  ring:new THREE.RingGeometry(0.82,1,48),plane:new THREE.PlaneGeometry(1,1),torus:new THREE.TorusGeometry(1,0.22,8,20,Math.PI)};
const mats={};
function M(c){if(!mats[c])mats[c]=new THREE.MeshLambertMaterial({color:c});return mats[c];}
function part(geo,mat,sx,sy,sz,x,y,z,shadow){const m=new THREE.Mesh(geo,typeof mat==='string'?M(mat):mat);m.scale.set(sx,sy,sz);m.position.set(x,y,z);if(shadow!==false){m.castShadow=true;m.receiveShadow=true;}return m;}
function flat(geo,col,sx,sz,x,z,y,opts){const m=new THREE.Mesh(geo,opts||M(col));m.rotation.x=-Math.PI/2;m.scale.set(sx,sz,1);m.position.set(x,y||0.01,z);m.receiveShadow=true;scene.add(m);return m;}

// Boden
const grassTex=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle='#6fbf5c';g.fillRect(0,0,256,256);
  for(let i=0;i<600;i++){g.fillStyle=Math.random()<.5?'#62b04f':'#80cd6b';const x=Math.random()*256,y=Math.random()*256;g.fillRect(x,y,2,5);g.fillRect(x+3,y+1,2,4);}
  const tx=new THREE.CanvasTexture(c);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(16,12);return tx;})();
const ground=new THREE.Mesh(new THREE.PlaneGeometry(110,80),new THREE.MeshLambertMaterial({map:grassTex}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
flat(G.plane,'#c9a66b',2.4,FZ-(COOP.z+COOP.d/2),0,(COOP.z+COOP.d/2+FZ)/2,0.012); // Weg zum Stall
MUD.forEach(m=>{flat(G.circle,'#7a5230',m.r,m.r*0.85,m.x,m.z,0.015);flat(G.circle,'#8a6038',m.r*0.6,m.r*0.45,m.x+0.3,m.z-0.2,0.02);});
// Zaun
(()=>{
  const post=M('#f4ede0'),rail=M('#e8dcc4');
  const side=(x1,z1,x2,z2)=>{const len=Math.hypot(x2-x1,z2-z1),n=Math.ceil(len/2);
    for(let i=0;i<=n;i++)scene.add(part(G.box,post,0.22,1.1,0.22,x1+(x2-x1)*i/n,0.55,z1+(z2-z1)*i/n));
    [0.45,0.85].forEach(y=>scene.add(part(G.box,rail,Math.abs(x2-x1)||0.1,0.1,Math.abs(z2-z1)||0.1,(x1+x2)/2,y,(z1+z2)/2)));};
  side(-FX,-FZ,FX,-FZ);side(-FX,FZ,FX,FZ);side(-FX,-FZ,-FX,FZ);side(FX,-FZ,FX,FZ);
})();
// Stall
(()=>{
  const g=new THREE.Group();g.position.set(COOP.x,0,COOP.z);
  g.add(part(G.box,'#d83a2a',COOP.w,2.6,COOP.d,0,1.3,0));
  // Giebeldach: Dreieck als Prisma, darauf zwei Dachflächen
  const hw=COOP.d/2+0.25,rh=1.5,ang=Math.atan2(rh,hw),slab=Math.hypot(hw,rh)+0.2;
  const tri=new THREE.Shape();tri.moveTo(-COOP.d/2,0);tri.lineTo(COOP.d/2,0);tri.lineTo(0,rh*(COOP.d/2)/hw);tri.lineTo(-COOP.d/2,0);
  const gab=new THREE.Mesh(new THREE.ExtrudeGeometry(tri,{depth:COOP.w,bevelEnabled:false}),M('#d83a2a'));
  gab.rotation.y=Math.PI/2;gab.position.set(-COOP.w/2,2.6,0);gab.castShadow=true;g.add(gab);
  const r1=part(G.box,'#7a2a1a',COOP.w+0.5,0.18,slab,0,2.6+rh/2+0.08,-hw/2);r1.rotation.x=-ang;g.add(r1);
  const r2=part(G.box,'#7a2a1a',COOP.w+0.5,0.18,slab,0,2.6+rh/2+0.08,hw/2);r2.rotation.x=ang;g.add(r2);
  [-1.6,1.6].forEach(x=>{g.add(part(G.box,'#ffffff',0.9,0.1,0.06,x,1.75,COOP.d/2+0.02,false));g.add(part(G.box,'#ffffff',0.1,0.9,0.06,x,1.75,COOP.d/2+0.02,false));g.add(part(G.box,'#ffe9a8',0.75,0.75,0.04,x,1.75,COOP.d/2+0.01,false));});
  g.add(part(G.box,'#3a1a10',1.4,1.5,0.06,0,0.75,COOP.d/2+0.02,false));
  g.add(part(G.box,'#ffffff',1.6,0.12,0.08,0,1.55,COOP.d/2+0.03,false));
  const ramp=part(G.box,'#a87a4a',1.3,0.08,1.2,0,0.25,COOP.d/2+0.55);ramp.rotation.x=0.35;g.add(ramp);
  scene.add(g);
})();

let actx=null,noiseBuf=null;
function audioInit(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C){actx=new C();noiseBuf=actx.createBuffer(1,actx.sampleRate*0.5,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}}if(actx&&actx.state==='suspended')actx.resume();}catch(e){actx=null;}}
function tone(type,f1,f2,start,dur,vol,filt){
  if(!actx||!soundOn)return;
  const t0=actx.currentTime+start,o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  let n=o;if(filt){const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=filt;o.connect(f);n=f;}
  n.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+dur+0.05);
}
function noise(start,dur,vol,freq){
  if(!actx||!soundOn||!noiseBuf)return;
  const t0=actx.currentTime+start,s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(actx.destination);s.start(t0);s.stop(t0+dur+0.05);
}

function catchChicken(c){
  chickens.splice(chickens.indexOf(c),1);
  scene.remove(c.mesh);stackGroup.add(c.mesh);
  c.mesh.rotation.set(0,0,0);c.mesh.userData.inner.position.y=0;
  stack.push({mesh:c.mesh,gold:c.gold});
  caught++;highStack=Math.max(highStack,stack.length);
  sfx.catch(c.gold);puff(c.x,0.8,c.z,6,c.gold);
  floatTxt(c.x,c.z,c.gold?t('gold'):t('cluck'),c.gold?'#ffd23f':'#ffffff',1.6);
  if(c.gold)toast(t('goldCaught'),'#ffd23f');
}
function topple(k,why){
  k=Math.min(k,stack.length);if(k<=0)return;
  const lost=stack.splice(stack.length-k,k);
  lost.forEach((s,i)=>{
    stackGroup.remove(s.mesh);scene.add(s.mesh);
    const a=Math.random()*Math.PI*2,sp=3+Math.random()*3;
    const c={x:player.x,z:player.z,y:2+(stack.length+i)*0.66,vy:4+Math.random()*3,vx:Math.cos(a)*sp,vz:Math.sin(a)*sp,face:a,state:'fly',tx:0,tz:0,wt:0,gold:s.gold,seed:Math.random()*6,peck:0,moving:1,mesh:s.mesh};
    chickens.push(c);
  });
  sfx.topple();puff(player.x,2.4,player.z,14);
  if(why!=='goose')toast(k===1?t('topple1'):t('topple',{n:k}),'#ff8f80');
  player.sx*=0.2;player.sz*=0.2;player.svx*=0.2;player.svz*=0.2;
}
function deliver(){
  const n=stack.length;if(!n)return;
  const base=stack.reduce((a,s)=>a+(s.gold?5:1),0),bonus=n>=3?n*(n-1)/2:0,p=base+bonus;
  score+=p;
  stack.forEach((s,i)=>{
    const wp=new THREE.Vector3();s.mesh.getWorldPosition(wp);
    stackGroup.remove(s.mesh);scene.add(s.mesh);s.mesh.position.copy(wp);
    hops.push({mesh:s.mesh,fx:wp.x,fy:wp.y,fz:wp.z,t:-i*0.08});
  });
  stack=[];player.sx=player.sz=player.svx=player.svz=0;
  sfx.deliver(n);puff(DOOR.x,1,DOOR.z,8);
  toast((n===1?t('deliver1',{p}):t('deliver',{n,p}))+(bonus?t('bonus'):''),'#7be04a');
  floatTxt(DOOR.x,DOOR.z,'+'+p,'#ffd23f',3,1.6);
}

cv.addEventListener('pointermove',e=>{if(!joy||joy.id!==e.pointerId)return;const r=stage.getBoundingClientRect();joy.x=e.clientX-r.left;joy.y=e.clientY-r.top;const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy),m=Math.min(d,46)/(d||1);joyEl.firstChild.style.transform=`translate(${dx*m}px,${dy*m}px)`;});
const endJoy=e=>{if(joy&&joy.id===e.pointerId){joy=null;joyEl.hidden=true;}};
cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(0.6,Math.min(1.6,zoom*(e.deltaY>0?1.1:0.9)));},{passive:false});

/* ---------- Update ---------- */
function update(dt){
  time+=dt;
  if(phase!=='play')return;
  elapsed+=dt;
  if(elapsed>=GAME_T){endGame();return;}
  if(!lateToast&&GAME_T-elapsed<15){lateToast=true;toast(t('late'),'#ff8f80');}
  // Spieler
  let ix=0,iz=0;
  if(keys['a']||keys['arrowleft'])ix--;if(keys['d']||keys['arrowright'])ix++;
  if(keys['w']||keys['arrowup'])iz--;if(keys['s']||keys['arrowdown'])iz++;
  if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>8){ix=dx/Math.max(d,46);iz=dy/Math.max(d,46);}}
  const il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il;}
  const n=stack.length;
  const maxSp=5.2*Math.max(0.6,1-0.045*n);
  const inMud=MUD.some(m=>Math.hypot(player.x-m.x,(player.z-m.z)/0.85)<m.r);
  if(inMud&&!player.mud){sfx.squelch();mudToastCd-=1;if(mudToastCd<=0){toast(t('mud'),'#c9a66b');mudToastCd=4;}}
  player.mud=inMud;
  player.stun=Math.max(0,player.stun-dt);player.inv=Math.max(0,player.inv-dt);
  const k=inMud?1.6:11;
  const tx=player.stun>0?0:ix*maxSp,tz=player.stun>0?0:iz*maxSp;
  const ax=(tx-player.vx)*k,az=(tz-player.vz)*k;
  player.vx+=ax*dt;player.vz+=az*dt;
  const ox=player.x,oz=player.z;
  player.x+=player.vx*dt;player.z+=player.vz*dt;
  collide(player,0.4);
  const rvx=(player.x-ox)/dt,rvz=(player.z-oz)/dt;
  const f=0.65*(1+0.08*n);
  // Anstoßen an Zaun/Hindernis gibt einen Ruck
  const bx=rvx-player.vx,bz=rvz-player.vz;
  if(Math.hypot(bx,bz)>0.5){player.svx-=bx*f*0.5;player.svz-=bz*f*0.5;}
  player.vx=rvx;player.vz=rvz;
  const sp=Math.hypot(rvx,rvz);
  player.moving=Math.min(1,sp/4);
  if(sp>0.4)player.face=Math.atan2(rvx,rvz);
  // Wackel-Physik
  player.svx+=(-30*player.sx-5*player.svx-ax*f)*dt;player.sx+=player.svx*dt;
  player.svz+=(-30*player.sz-5*player.svz-az*f)*dt;player.sz+=player.svz*dt;
  if(inMud&&sp>1&&n>0){player.svx+=(Math.random()-0.5)*14*dt*(1+n*0.1);player.svz+=(Math.random()-0.5)*14*dt*(1+n*0.1);}
  const thr=Math.max(0.38,0.92-0.06*n);
  player.wob=n?Math.hypot(player.sx,player.sz)/thr:0;
  if(n>=2&&player.wob>1)topple(Math.ceil(n/2));
  // Abgeben
  if(n>0&&dist(player,DOOR)<1.7)deliver();
  // Hühner
  for(const c of chickens.slice()){
    const d=dist(c,player);
    if(c.state==='fly'){
      c.vy-=16*dt;c.y+=c.vy*dt;c.x+=c.vx*dt;c.z+=c.vz*dt;
      if(c.y<=0){c.y=0;c.state='flee';}
    } else {
      const scared=player.stun<=0&&d<(c.gold?4.6:3.6);
      if(scared)c.state='flee';else if(c.state==='flee'&&d>6.5){c.state='wander';c.wt=0;}
      let vx=0,vz=0,s=0;
      if(c.state==='flee'){
        const ax2=(c.x-player.x)/(d||1),az2=(c.z-player.z)/(d||1),zig=Math.sin(time*7+c.seed)*0.65;
        vx=ax2-az2*zig;vz=az2+ax2*zig;s=c.gold?4.7:3.9;
      } else {
        c.wt-=dt;
        if(c.wt<=0){c.wt=2+Math.random()*3;if(Math.random()<0.4){c.tx=c.x;c.tz=c.z;c.peck=1.5;}else{const a=Math.random()*Math.PI*2,r=2+Math.random()*4;c.tx=c.x+Math.cos(a)*r;c.tz=c.z+Math.sin(a)*r;}}
        vx=c.tx-c.x;vz=c.tz-c.z;s=Math.hypot(vx,vz)>0.3?1.2:0;
      }
      const vl=Math.hypot(vx,vz)||1;c.x+=vx/vl*s*dt;c.z+=vz/vl*s*dt;c.moving=s>0?s/4:0;
      if(s>0)c.face=Math.atan2(vx,vz);
      c.peck=Math.max(0,c.peck-dt);
    }
    collide(c,0.3);
    if(c.state!=='fly'&&player.stun<=0&&dist(c,player)<0.9)catchChicken(c);
  }
  // Nachschub
  spawnT-=dt;
  const want=10+Math.floor(elapsed/30);
  if(spawnT<=0){
    spawnT=7;
    if(chickens.length+stack.length<want){
      const gold=!chickens.some(c=>c.gold)&&!stack.some(s=>s.gold)&&Math.random()<0.18;
      const side=Math.random()<0.5?-1:1,p={x:side*(FX-1.2),z:(Math.random()*2-1)*(FZ-2)};
      if(blockedAt(p,0.9))p.z=0;
      const cnt=Math.min(3,want-chickens.length-stack.length);
      for(let i=0;i<cnt;i++)spawnChicken(gold&&i===0,{x:p.x,z:p.z+i*0.8});
      if(cnt>1)toast(t('newChickens'),'#ffffff');
    }
  }
  if(!goose2Done&&elapsed>60){goose2Done=true;spawnGoose(TRACTOR.x+3,TRACTOR.z+3.5);toast(t('goose2'),'#ff8f80');sfx.honk();}
  // Gänse
  for(const g of geese){
    g.cd=Math.max(0,g.cd-dt);g.honkT=Math.max(0,g.honkT-dt);
    const d=dist(g,player);
    let tx2=g.tx,tz2=g.tz,s=1.5;
    if(g.state==='patrol'){
      g.wt-=dt;if(g.wt<=0||Math.hypot(g.tx-g.x,g.tz-g.z)<0.4){g.wt=3+Math.random()*3;const a=Math.random()*Math.PI*2,r=Math.random()*6;g.tx=g.home.x+Math.cos(a)*r;g.tz=g.home.z+Math.sin(a)*r;}
      tx2=g.tx;tz2=g.tz;
      if(d<5&&g.cd<=0&&player.inv<=0){g.state='chase';g.t=4;sfx.honk();g.honkT=1;toast(t('gooseAngry'),'#ff8f80');}
    } else if(g.state==='chase'){
      tx2=player.x;tz2=player.z;s=4.4;g.t-=dt;
      if(Math.random()<dt*1.5){sfx.honk();g.honkT=0.8;}
      if(g.t<=0){g.state='return';g.cd=4;}
      if(d<0.9&&player.inv<=0){
        player.stun=1.2;player.inv=2.5;player.vx=(player.x-g.x)*6;player.vz=(player.z-g.z)*6;
        sfx.honk();g.honkT=1.4;
        if(stack.length){const k2=stack.length;topple(k2,'goose');}
        toast(t('gooseHit'),'#ff8f80');
        g.state='return';g.cd=5;
      }
    } else {
      tx2=g.home.x;tz2=g.home.z;s=2.2;if(Math.hypot(g.x-tx2,g.z-tz2)<0.6){g.state='patrol';g.wt=0;}
    }
    const vx=tx2-g.x,vz=tz2-g.z,vl=Math.hypot(vx,vz);
    if(vl>0.1){g.x+=vx/vl*s*dt;g.z+=vz/vl*s*dt;g.face=Math.atan2(vx,vz);g.moving=s/4;}else g.moving=0;
    collide(g,0.45);
  }
  floats.forEach(q=>{q.life-=dt;q.h+=0.9*dt;});floats=floats.filter(q=>q.life>0);
}

/* ---------- Darstellung ---------- */
function turn(m,face,k){let d=face-m.rotation.y;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;m.rotation.y+=d*k;}
function animChicken(c){
  const u=c.mesh.userData;
  c.mesh.position.set(c.x,c.y,c.z);turn(c.mesh,c.face,0.3);
  const run=c.state==='flee'||c.state==='fly';
  const sw=c.moving?Math.sin(time*(run?26:12)+c.seed)*0.8:0;
  u.legs[0].rotation.x=sw;u.legs[1].rotation.x=-sw;
  const flap=run?Math.sin(time*30+c.seed)*0.9:0;
  u.wings[0].rotation.z=flap;u.wings[1].rotation.z=-flap;
  u.inner.position.y=run&&c.state!=='fly'?Math.abs(Math.sin(time*13+c.seed))*0.22:0;
  u.head.rotation.x=c.peck>0?Math.max(0,Math.sin(time*14))*0.9:0;
  u.head.position.z=0.26+(run?0.06:0);
}
function syncWorld(){
  // Spieler
  const m=player.mesh,u=m.userData;
  m.position.set(player.x,0,player.z);turn(m,player.face,0.25);
  const sw=player.moving?Math.sin(time*14)*0.7*player.moving:0;
  u.legs[0].rotation.x=sw;u.legs[1].rotation.x=-sw;
  const up=stack.length?-2.6:0;
  u.arms[0].rotation.x=up||-sw;u.arms[1].rotation.x=up||sw;
  u.inner.rotation.z=player.stun>0?Math.sin(time*25)*0.25:0;
  u.inner.rotation.x=player.stun>0?-0.5:0;
  m.visible=!(player.inv>0&&player.stun<=0&&Math.floor(time*10)%2===0);
  // Stapel auf dem Kopf
  stackGroup.position.set(player.x,0,player.z);
  stack.forEach((s,i)=>{
    const lv=i+1,wig=Math.sin(time*9+i)*0.02*(1+player.wob*3);
    s.mesh.position.set(player.sx*lv*0.6+wig,2.08+i*0.66,player.sz*lv*0.6);
    s.mesh.rotation.y=player.face+Math.sin(time*2+i)*0.4;
    s.mesh.rotation.z=-player.sx*0.6;s.mesh.rotation.x=player.sz*0.6;
    const su=s.mesh.userData,fl=player.wob>0.55?Math.sin(time*30+i)*0.9:Math.sin(time*3+i)*0.1;
    su.wings[0].rotation.z=fl;su.wings[1].rotation.z=-fl;su.legs[0].rotation.x=0;su.legs[1].rotation.x=0;
  });
  for(const c of chickens)animChicken(c);
  // Gänse
  for(const g of geese){
    const gu=g.mesh.userData;g.mesh.position.set(g.x,0,g.z);turn(g.mesh,g.face,0.2);
    const s2=g.moving?Math.sin(time*(g.state==='chase'?20:9))*0.6:0;gu.legs[0].rotation.x=s2;gu.legs[1].rotation.x=-s2;
    gu.neck.rotation.x=g.state==='chase'?1.0:Math.sin(time*2)*0.1;
    const fl=g.state==='chase'?0.6+Math.sin(time*24)*0.5:0;gu.wings[0].rotation.z=fl;gu.wings[1].rotation.z=-fl;
    gu.inner.rotation.z=g.state==='chase'?Math.sin(time*20)*0.08:0;
  }
  // Hüpfer in den Stall
  for(const h of hops.slice()){
    h.t+=1/60*1.6;const k=Math.max(0,Math.min(1,h.t));
    h.mesh.position.set(h.fx+(DOOR.x-h.fx)*k,h.fy+(0.6-h.fy)*k+Math.sin(k*Math.PI)*1.5,h.fz+(COOP.z+COOP.d/2-0.3-h.fz)*k);
    h.mesh.scale.setScalar(1-Math.max(0,k-0.8)*4);
    if(h.t>=1){scene.remove(h.mesh);h.mesh.scale.setScalar(1);hops.splice(hops.indexOf(h),1);}
  }
  // Federn
  for(const f of feathers){if(f.life<=0)continue;f.life-=1/60;f.vy-=3/60;f.vy=Math.max(f.vy,-0.8);f.vx*=0.98;f.vz*=0.98;f.x+=f.vx/60;f.y+=f.vy/60;f.z+=f.vz/60;
    f.mesh.position.set(f.x,Math.max(0.05,f.y),f.z);f.mesh.rotation.set(time*f.spin,time*2+f.spin,Math.sin(time*5+f.spin));if(f.life<=0)f.mesh.visible=false;}
  vane.rotation.y=Math.sin(time*0.4)*1.2;
  dropRing.material.opacity=stack.length?0.6+Math.sin(time*6)*0.35:0.35;
  dropRing.scale.setScalar(1.7*(stack.length?1+Math.sin(time*6)*0.06:1));
}
const labelLayer=$('labels'),pool=[];let li=0,cw=1,ch=1;const v3=new THREE.Vector3();
function lab(text,x,y,z,col,size,bg){
  v3.set(x,y,z).project(camera);
  if(v3.z>1||Math.abs(v3.x)>1.1||Math.abs(v3.y)>1.1)return;
  let el=pool[li];if(!el){el=document.createElement('div');el._s={};labelLayer.appendChild(el);pool.push(el);}li++;
  const s=el._s,cn='lb'+(bg?' bg':'');
  if(s.cn!==cn){el.className=cn;s.cn=cn;}
  if(s.t!==text){el.textContent=text;s.t=text;}
  if(s.c!==col){el.style.color=col||'';s.c=col;}
  const fs=(size||13)+'px';if(s.f!==fs){el.style.fontSize=fs;s.f=fs;}
  if(s.h){el.hidden=false;s.h=false;}
  el.style.transform=`translate(${((v3.x*.5+.5)*cw).toFixed(1)}px,${((-v3.y*.5+.5)*ch).toFixed(1)}px) translate(-50%,-50%)`;
}
function drawLabels(){
  li=0;cw=stage.clientWidth;ch=stage.clientHeight;
  lab(t('coop'),COOP.x,4.4,COOP.z,'#ffffff',15);
  if(phase==='play'&&stack.length)lab(t('drop'),DOOR.x,0.9,DOOR.z+0.3,'#ffd23f',13,true);
  for(const c of chickens)if(c.gold)lab(t('gold'),c.x,c.y+1.5,c.z,'#ffd23f',12);
  for(const g of geese)if(g.honkT>0)lab(t('honk'),g.x,2.2,g.z,'#ff8f80',16);
  for(const f of floats)lab(f.txt,f.x,f.h,f.z,f.col,17);
  for(let i=li;i<pool.length;i++){if(!pool[i]._s.h){pool[i].hidden=true;pool[i]._s.h=true;}}
}
const mini=$('mini'),mc=mini.getContext('2d');
function drawMini(){
  const kx=mini.width/(FX*2),kz=mini.height/(FZ*2);
  mc.setTransform(kx,0,0,kz,FX*kx,FZ*kz);
  mc.fillStyle='#6fbf5c';mc.fillRect(-FX,-FZ,FX*2,FZ*2);
  mc.fillStyle='#7a5230';for(const m of MUD){mc.beginPath();mc.ellipse(m.x,m.z,m.r,m.r*0.85,0,0,7);mc.fill();}
  mc.fillStyle='#4fb3ff';mc.beginPath();mc.arc(POND.x,POND.z,POND.r,0,7);mc.fill();
  mc.fillStyle='#d83a2a';mc.fillRect(COOP.x-COOP.w/2,COOP.z-COOP.d/2,COOP.w,COOP.d);
  mc.fillStyle='#3f9c4e';mc.fillRect(TRACTOR.x-TRACTOR.w/2,TRACTOR.z-TRACTOR.d/2,TRACTOR.w,TRACTOR.d);
  mc.fillStyle='#e8c25a';for(const h of HAY){mc.beginPath();mc.arc(h.x,h.z,h.r,0,7);mc.fill();}
  for(const c of chickens){mc.fillStyle=c.gold?'#ffd23f':'#ffffff';mc.beginPath();mc.arc(c.x,c.z,0.7,0,7);mc.fill();}
  mc.fillStyle='#ff8f80';for(const g of geese){mc.beginPath();mc.arc(g.x,g.z,0.9,0,7);mc.fill();}
  mc.fillStyle='#2f5fb8';mc.strokeStyle='#ffffff';mc.lineWidth=0.4;mc.beginPath();mc.arc(player.x,player.z,1.1,0,7);mc.fill();mc.stroke();
}
function hud(){
  $('hScore').textContent=t('tScore',{n:score});$('sScore').textContent=score;
  const left=Math.max(0,Math.ceil(GAME_T-elapsed));
  const tm=$('hTime');tm.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  tm.classList.toggle('late',phase==='play'&&left<=15);
  $('wStack').textContent='×'+stack.length;
  const w=Math.min(1,player.wob);
  const bar=$('wBar');bar.style.width=(w*100).toFixed(0)+'%';
  bar.style.background=w>0.8?'#ff5d4f':w>0.55?'#ffb020':'#7be04a';
}

/* ---------- Loop ---------- */
resize();
const camT=new THREE.Vector3(0,0,0),tmpV=new THREE.Vector3();
camera.position.set(0,16,12);
let last=performance.now(),hudT=0,miniT=0,acc=0;
const STEP=1/60;
function loop(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  // feste 60-Hz-Schritte: das Wackeln verhält sich auf jedem Gerät gleich
  acc+=dt;let steps=0;
  while(acc>=STEP&&steps<6){update(STEP);acc-=STEP;steps++;}
  if(steps>=6)acc=0;
  syncWorld();
  if(phase==='start'){camT.set(Math.sin(time*0.15)*6,0,Math.cos(time*0.15)*3);}
  else camT.lerp(tmpV.set(player.x,0,player.z),0.12);
  const narrow=stage.clientWidth<640,dz=(narrow?13.5:11)*zoom,dy=(narrow?16:12.5)*zoom;
  camera.position.lerp(tmpV.set(camT.x,dy+stack.length*0.35,camT.z+dz),0.1);
  camera.lookAt(camT.x,1+stack.length*0.2,camT.z);
  renderer.render(scene,camera);
  drawLabels();
  miniT-=dt;if(miniT<=0){miniT=0.1;drawMini();}
  hudT-=dt;if(hudT<=0){hudT=0.08;hud();}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// Schon im Startbildschirm ein paar Hühner zeigen
for(let i=0;i<8;i++)spawnChicken(false,freePoint(null));
spawnGoose(POND.x-1,POND.z+4.2);
window.__hc={get player(){return player},get chickens(){return chickens},get stack(){return stack},get score(){return score},get geese(){return geese},catchChicken,topple,DOOR};
})();
